name: Build Application Template Image
on:
  workflow_dispatch:
    inputs:
      template_id:
        description: Dashboard application template ID
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v2
        id: dependencies
        with:
          app-id: ${{ secrets.LIGHTEK_CI_APP_ID || vars.LIGHTEK_CI_APP_ID }}
          private-key: ${{ secrets.LIGHTEK_CI_APP_PRIVATE_KEY }}
          owner: lightekmcg
      - name: Configure private dependency access
        env:
          TOKEN: ${{ steps.dependencies.outputs.token }}
        run: |
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - run: bundle install
      - name: Package Rails application
        run: python3 script/lightek/build_fleet_release.py --output "$RUNNER_TEMP/template-image"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Image coordinates
        id: coordinates
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/design" >> "$GITHUB_OUTPUT"
          echo "bundler=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/template-image/fleet-build.json"))["bundler"])')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ runner.temp }}/template-image
          push: true
          platforms: linux/amd64
          tags: ${{ steps.coordinates.outputs.image }}:${{ github.sha }}-${{ github.run_id }}
          build-args: |
            BUNDLER_VERSION=${{ steps.coordinates.outputs.bundler }}
      - name: Publish template to Dashboard
        env:
          CALLBACK: ${{ vars.GATEKEEPER_APPLICATION_IMAGE_URL }}
          TOKEN: ${{ secrets.GATEKEEPER_FLEET_RELEASE_TOKEN }}
          TEMPLATE_ID: ${{ inputs.template_id }}
          IMAGE: ${{ steps.coordinates.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CALLBACK" == https://* && -n "$TOKEN" ]] || { echo 'Configure GATEKEEPER_APPLICATION_IMAGE_URL and GATEKEEPER_FLEET_RELEASE_TOKEN.'; exit 1; }
          jq -n --arg template_id "$TEMPLATE_ID" --arg image "$IMAGE" '{template_id:$template_id,image:$image}' > "$RUNNER_TEMP/application-image.json"
          curl --fail-with-body --retry 3 --max-time 60 -sS "$CALLBACK" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/application-image.json"
          echo "Published image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Record build failure
        if: failure()
        env:
          CALLBACK: ${{ vars.GATEKEEPER_APPLICATION_IMAGE_URL }}
          TOKEN: ${{ secrets.GATEKEEPER_FLEET_RELEASE_TOKEN }}
          TEMPLATE_ID: ${{ inputs.template_id }}
        run: |
          [[ "$CALLBACK" == https://* && -n "$TOKEN" ]] || exit 0
          jq -n --arg template_id "$TEMPLATE_ID" '{template_id:$template_id,status:"failed"}' > "$RUNNER_TEMP/application-image-failure.json"
          curl --fail --retry 3 --max-time 60 -sS "$CALLBACK" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/application-image-failure.json"
