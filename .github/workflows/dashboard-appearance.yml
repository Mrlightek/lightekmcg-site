name: Dashboard appearance
on:
  pull_request:
    paths:
      - 'app/controllers/dashboard/appearance_colors_controller.rb'
      - 'app/services/lightek_dashboard/**'
      - 'app/views/dashboard/**'
      - 'app/views/dymond_dash/**'
      - 'public/lightek/dashboard.*'
      - 'public/lightek/reservations-workspace.css'
      - 'public/lightek/production-workflow.css'
      - 'public/lightek/site-content.css'
      - 'test/javascript/dashboard_workspace_browser_test.cjs'
      - 'public/lightek/business-workspace.css'
      - 'test/standalone/dashboard_appearance_test.rb'
      - 'test/standalone/dashboard_network_view_test.rb'
      - 'app/helpers/nevaeh_control_center_helper.rb'
      - 'test/standalone/dashboard_breadcrumbs_test.rb'
      - '.github/workflows/dashboard-appearance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appearance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install public Rails fixture dependencies
        run: |
          gem install --no-document activerecord:8.0.5.1 actionpack:8.0.5.1 sqlite3:2.7.4 minitest:5.25.4
      - name: Verify theme persistence and operator permissions
        run: ruby test/standalone/dashboard_appearance_test.rb
      - name: Verify Network form actions and DNS fields
        run: ruby test/standalone/dashboard_network_view_test.rb
      - name: Verify shared navigation
        run: ruby test/standalone/dashboard_breadcrumbs_test.rb
      - name: Check navigation script
        run: node --check public/lightek/dashboard.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace browser checks
        run: |
          npm install --prefix /tmp/dashboard-ci playwright@1.56.1
          /tmp/dashboard-ci/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify workspace palettes in desktop and mobile browsers
        env:
          NODE_PATH: /tmp/dashboard-ci/node_modules
        run: node test/javascript/dashboard_workspace_browser_test.cjs
