name: Deploy Production

on:
  push:
    branches: [main, fix/paid-instance-provisioning-recovery-20261028]
  workflow_dispatch:
    inputs:
      project_id:
        required: false
        type: string
      operation_id:
        required: false
        type: string
      requested_by:
        required: false
        default: gatekeeper
        type: string

concurrency:
  group: lightekmcg-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: lightekmcg-site
  APP_ROOT: /var/www/lightekmcg-site
  APP_USER: lightek
  APP_DOMAIN: lightekmcg.com
  APP_BRANCH: ${{ github.ref_name }}
  RUBY_VERSION: 3.3.6
  APACHE_SERVICE: apache2
  SIDEKIQ_SERVICE: lightekmcg-site-sidekiq
  ENV_FILE: /etc/lightek/lightekmcg-site.env

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify DNS recovery regressions before release
        run: |
          ruby test/scripts/paid_dns_recovery_standalone.rb
          python3 -m unittest discover -s test/scripts -p 'test_paid_instance_verification.py' -v
          python3 -m unittest discover -s test/scripts -p 'test_manual_instance_config.py' -v

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lightek_deploy
          chmod 600 ~/.ssh/lightek_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Notify Gatekeeper started
        id: start
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ vars.GATEKEEPER_CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.GATEKEEPER_DEPLOY_CALLBACK_TOKEN }}
          INPUT_PROJECT_ID: ${{ inputs.project_id }}
          INPUT_OPERATION_ID: ${{ inputs.operation_id }}
          INPUT_REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          set -euo pipefail
          [[ -n "${CALLBACK_URL:-}" && -n "${CALLBACK_TOKEN:-}" ]] || exit 0
          REQUESTED_BY="${INPUT_REQUESTED_BY:-github_push:${GITHUB_ACTOR}}"
          PAYLOAD=$(jq -n --arg state started --arg project_id "${INPUT_PROJECT_ID:-}" --arg operation_id "${INPUT_OPERATION_ID:-}" --arg requested_by "$REQUESTED_BY" --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF_NAME" --arg run_id "$GITHUB_RUN_ID" --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,project_id:(if $project_id=="" then null else $project_id end),project_name:"lightekmcg-site",operation_id:(if $operation_id=="" then null else $operation_id end),requested_by:$requested_by,repository:$repository,ref:$ref,run_id:$run_id,run_url:$run_url}')
          RESPONSE=$(curl --fail-with-body -sS -X POST "$CALLBACK_URL" -H "Authorization: Bearer $CALLBACK_TOKEN" -H "Content-Type: application/json" --data "$PAYLOAD")
          echo "$RESPONSE"
          OP_ID=$(echo "$RESPONSE" | jq -r '.operation_id // empty')
          [[ -z "$OP_ID" ]] || echo "GATEKEEPER_OPERATION_ID=$OP_ID" >> "$GITHUB_ENV"

      - name: Deploy production
        id: deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          case "$APP_BRANCH" in
            main|fix/paid-instance-provisioning-recovery-20261028) ;;
            *) echo 'Ref is not authorized for production deployment'; exit 1 ;;
          esac

          ssh -i ~/.ssh/lightek_deploy -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "bash -s -- '$APP_BRANCH'" <<'LIGHTEK_DEPLOY' | tee deploy-output.txt
            set -e
            # Restore the repository's documented production ownership model.
            bash /var/www/lightekmcg-site/lib/scripts/repair_lightek_production_permissions.sh
            if [[ "$1" == fix/paid-instance-provisioning-recovery-20261028 ]]; then
              # Preserve interrupted checkout and manual source changes locally.
              # Ignored runtime data/environment files remain in place.
              sudo -u lightek -H git -C /var/www/lightekmcg-site \
                -c user.name='Lightek Release' -c user.email='deploy@lightekmcg.com' \
                stash push --include-untracked -m paid-order-1-pre-release-recovery
            fi

            APP_ROOT=/var/www/lightekmcg-site \
            APP_USER=lightek \
            APP_NAME=lightekmcg-site \
            APP_DOMAIN=lightekmcg.com \
            APP_BRANCH="$1" \
            RUBY_VERSION=3.3.6 \
            APACHE_SERVICE=apache2 \
            SIDEKIQ_SERVICE=lightekmcg-site-sidekiq \
            ENV_FILE=/etc/lightek/lightekmcg-site.env \
            bash /var/www/lightekmcg-site/lib/scripts/gatekeeper/deploy_project.sh
            bash /var/www/lightekmcg-site/lib/scripts/prepare_apache_passenger_env.sh
            systemctl restart apache2
            systemctl is-active --quiet apache2
            curl --fail --silent --show-error --retry 8 --retry-connrefused --retry-delay 2 --max-time 20 https://lightekmcg.com/up -o /dev/null
          LIGHTEK_DEPLOY

          DEPLOYED_SHA="$(grep '^GATEKEEPER_DEPLOYED_SHA=' deploy-output.txt | tail -1 | cut -d= -f2-)"
          HTTP_STATUS="$(grep '^GATEKEEPER_HTTP_STATUS=' deploy-output.txt | tail -1 | cut -d= -f2-)"

          echo "deployed_sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          echo "http_status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"

      - name: Update existing installation password presentation and verify live UI
        if: github.ref_name == 'fix/paid-instance-provisioning-recovery-20261028'
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOYED_SHA: ${{ steps.deploy.outputs.deployed_sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYED_SHA" == "$GITHUB_SHA" ]] || { echo 'Deployment revision differs from tested commit'; exit 1; }
          ssh -i ~/.ssh/lightek_deploy -p "${SSH_PORT:-22}" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'LIGHTEK_RECOVERY'
            set -euo pipefail
            run_application() {
              sudo -u lightek -H env -u GEM_HOME -u GEM_PATH bash -lc '
                set -euo pipefail
                set -a
                source /etc/lightek/lightekmcg-site.env
                set +a
                export RBENV_ROOT=/home/lightek/.rbenv
                export PATH=/home/lightek/.rbenv/versions/3.3.6/bin:/home/lightek/.rbenv/bin:/usr/local/bin:/usr/bin:/bin
                export RAILS_ENV=production
                cd /var/www/lightekmcg-site
                "$@"
              ' lightek-runtime "$@"
            }
            run_application env -u DATABASE_URL RAILS_ENV=test bin/rails runner 'abort "Unsafe test database" unless Rails.env.test? && ActiveRecord::Base.connection_db_config.database == "lightekmcg_site_test"'
            run_application env -u DATABASE_URL RAILS_ENV=test bin/rails db:migrate
            run_application env -u DATABASE_URL RAILS_ENV=test PARALLEL_WORKERS=1 bin/rails test test/controllers/installations_flow_test.rb
            run_application env LIGHTEK_PASSWORD_UI_ORDER_ID=1 bin/rails runner script/lightek/update_installation_password_ui.rb
            run_application env LIGHTEK_ACCEPTANCE_ORDER_ID=1 bin/rails runner script/lightek/installation_ui_acceptance.rb
          LIGHTEK_RECOVERY

      - name: Notify Gatekeeper succeeded
        if: success()
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ vars.GATEKEEPER_CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.GATEKEEPER_DEPLOY_CALLBACK_TOKEN }}
          INPUT_PROJECT_ID: ${{ inputs.project_id }}
          INPUT_OPERATION_ID: ${{ inputs.operation_id }}
          INPUT_REQUESTED_BY: ${{ inputs.requested_by }}
          DEPLOYED_SHA: ${{ steps.deploy.outputs.deployed_sha }}
          HTTP_STATUS: ${{ steps.deploy.outputs.http_status }}
        run: |
          set -euo pipefail
          [[ -n "${CALLBACK_URL:-}" && -n "${CALLBACK_TOKEN:-}" ]] || exit 0
          OP_ID="${GATEKEEPER_OPERATION_ID:-${INPUT_OPERATION_ID:-}}"
          REQUESTED_BY="${INPUT_REQUESTED_BY:-github_push:${GITHUB_ACTOR}}"
          jq -n --arg state succeeded --arg project_id "${INPUT_PROJECT_ID:-}" --arg operation_id "$OP_ID" --arg requested_by "$REQUESTED_BY" --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF_NAME" --arg run_id "$GITHUB_RUN_ID" --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg sha "$DEPLOYED_SHA" --arg http_status "$HTTP_STATUS" '{state:$state,project_id:(if $project_id=="" then null else $project_id end),project_name:"lightekmcg-site",operation_id:(if $operation_id=="" then null else $operation_id end),requested_by:$requested_by,repository:$repository,ref:$ref,run_id:$run_id,run_url:$run_url,sha:$sha,http_status:$http_status}' > callback.json
          curl --fail-with-body -sS -X POST "$CALLBACK_URL" -H "Authorization: Bearer $CALLBACK_TOKEN" -H "Content-Type: application/json" --data @callback.json

      - name: Notify Gatekeeper failed
        if: failure()
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ vars.GATEKEEPER_CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.GATEKEEPER_DEPLOY_CALLBACK_TOKEN }}
          INPUT_PROJECT_ID: ${{ inputs.project_id }}
          INPUT_OPERATION_ID: ${{ inputs.operation_id }}
          INPUT_REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          set -euo pipefail
          [[ -n "${CALLBACK_URL:-}" && -n "${CALLBACK_TOKEN:-}" ]] || exit 0
          OP_ID="${GATEKEEPER_OPERATION_ID:-${INPUT_OPERATION_ID:-}}"
          REQUESTED_BY="${INPUT_REQUESTED_BY:-github_push:${GITHUB_ACTOR}}"
          OUTPUT=""; [[ ! -f deploy-output.txt ]] || OUTPUT=$(tail -c 12000 deploy-output.txt)
          jq -n --arg state failed --arg project_id "${INPUT_PROJECT_ID:-}" --arg operation_id "$OP_ID" --arg requested_by "$REQUESTED_BY" --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF_NAME" --arg run_id "$GITHUB_RUN_ID" --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg output "$OUTPUT" --arg error "GitHub Actions production deployment failed" '{state:$state,project_id:(if $project_id=="" then null else $project_id end),project_name:"lightekmcg-site",operation_id:(if $operation_id=="" then null else $operation_id end),requested_by:$requested_by,repository:$repository,ref:$ref,run_id:$run_id,run_url:$run_url,output:$output,error:$error}' > callback.json
          curl --fail-with-body -sS -X POST "$CALLBACK_URL" -H "Authorization: Bearer $CALLBACK_TOKEN" -H "Content-Type: application/json" --data @callback.json
