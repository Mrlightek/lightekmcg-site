name: Deployment preflight
on:
  pull_request:
    paths:
      - 'lib/scripts/**'
      - 'script/lightek/native_website_remote.sh'
      - 'app/services/gatekeeper/website_deployment.rb'
      - 'config/schedule.yml'
      - 'config/initializers/sidekiq.rb'
      - 'config/initializers/dymond_site_patch.rb'
      - 'test/standalone/dymond_site_initialization_test.rb'
      - 'test/standalone/scheduler.Gemfile'
      - 'test/standalone/sidekiq_cron_dispatch_checks.rb'
      - 'test/standalone/website_deployment_dispatch_test.rb'
      - 'test/operations/**'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/deployment-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
      - name: Verify real scheduled Active Job dispatch
        env:
          BUNDLE_GEMFILE: test/standalone/scheduler.Gemfile
        run: |
          bundle install
          bundle exec ruby test/standalone/sidekiq_cron_dispatch_checks.rb
          bundle exec ruby test/standalone/website_deployment_dispatch_test.rb
      - name: Verify deployment operation regressions before merge
        env:
          BUNDLE_GEMFILE: test/standalone/Gemfile
        run: |
          bundle install
          bundle exec ruby test/standalone/dymond_site_initialization_test.rb
      - name: Verify deployment shell regressions before merge
        run: |
          python3 -m unittest test.operations.bootstrap_ruby_build_test
          python3 -m unittest test.operations.installer_diagnostics_test test.operations.native_site_reservation_test test.operations.deploy_checkout_test test.operations.deployment_storage_test test.operations.session_media_access_test test.operations.deploy_release_bootstrap_test test.operations.studio_docker_access_test test.operations.studio_worker_limits_test test.operations.studio_media_setup_test test.operations.studio_workstation_units_test test.operations.studio_spatial_setup_test test.operations.studio_spatial_packages_test
      - name: Verify primary worker recovery and rehearse database replacement
        run: |
          python3 -m unittest test.operations.primary_worker_watchdog_test
          docker pull postgres:16
          LIGHTEK_REAL_PRIMARY_CUTOVER=1 python3 -m unittest test.operations.primary_database_cutover_test
