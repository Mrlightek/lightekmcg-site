name: Enterprise identity and bookkeeping acceptance
on:
  pull_request:
    paths:
      - 'app/**'
      - 'config/routes/**'
      - 'config/routes.rb'
      - 'db/migrate/*enterprise_identity*'
      - 'db/migrate/*connect_mfa_handoff*'
      - 'db/migrate/*first_use_password_setup*'
      - 'script/lightek/verify_paid_instance.py'
      - 'script/lightek/website_deploy.sh'
      - 'lib/scripts/gatekeeper/install_container_application.py'
      - 'test/scripts/test_paid_instance_verification.py'
      - 'test/standalone/website_deployment_dispatch_test.rb'
      - 'db/migrate/*dymond_bookkeeping*'
      - 'db/migrate/*jurisdiction_monitoring*'
      - 'lib/scripts/gatekeeper/directory_membership.py'
      - 'public/lightek/accounting-live.js'
      - 'test/standalone/enterprise*'
      - 'test/standalone/agency_demo_checks.rb'
      - 'config/schedule.yml'
      - 'db/migrate/*agency_demos*'
      - 'public/lightek/mfa-enrollment*'
      - 'public/lightek/mfa-recovery.js'
      - 'public/lightek/people-workspace.css'
      - 'public/lightek/vendor/qrcode-generator/**'
      - 'test/javascript/mfa_qr*'
      - 'test/javascript/account_onboarding_browser_test.cjs'
      - 'test/javascript/mfa_recovery_test.cjs'
      - 'test/standalone/people*'
      - 'test/operations/directory_membership_test.py'
      - '.github/workflows/enterprise-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enterprise:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: enterprise
          POSTGRES_DB: enterprise_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PEOPLE_DATABASE_URL: postgres://postgres:enterprise@localhost:5432/enterprise_test?pool=8
      MT_NO_PLUGINS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: false
      - name: Install public test dependencies
        run: gem install 'activerecord:8.0.5' 'actionpack:8.0.5' 'railties:8.0.5' 'actionmailer:8.0.5' bcrypt 'minitest:~>5.25' pg 'sqlite3:~>2.7' 'jwt:2.10.3' 'rubyzip:3.4.1' nokogiri --no-document
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QR browser acceptance dependencies
        run: |
          npm install --prefix /tmp/mfa-qr-ci playwright@1.56.1 jsqr@1.4.0 pngjs@7.0.0 jsdom@26.1.0
          /tmp/mfa-qr-ci/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify authentication, tenant permissions and bookkeeping workflows
        env:
          MFA_QR_CAPTURE_DIR: /tmp/mfa-qr-render
        run: ruby test/standalone/agency_demo_checks.rb
      - name: Decode actual enrollment QR and verify desktop/phone rendering
        env:
          NODE_PATH: /tmp/mfa-qr-ci/node_modules
          MFA_QR_CAPTURE_DIR: /tmp/mfa-qr-render
        run: |
          node test/javascript/mfa_qr_encoding_test.cjs
          node test/javascript/mfa_recovery_test.cjs
          node test/javascript/mfa_qr_browser_test.cjs
          node test/javascript/account_onboarding_browser_test.cjs
      - name: Verify staged provisioning acceptance and invitation mail
        run: |
          python3 -m unittest test.scripts.test_paid_instance_verification
          ruby test/standalone/website_deployment_dispatch_test.rb
          ruby test/standalone/lightek_transactional_mail_test.rb
      - name: Verify domain allowlists and stale revocation handling
        run: python3 -m unittest test/operations/directory_membership_test.py
      - name: Verify reconciliation client syntax
        run: node --check public/lightek/accounting-live.js
