name: Lightek mail routing
on:
  pull_request:
    paths:
      - 'config/environments/production.rb'
      - 'config/initializers/lightek_mail_studio.rb'
      - 'app/services/lightek_mail/**'
      - 'app/mailers/**'
      - 'app/controllers/dashboard/mail_transport_controller.rb'
      - 'app/views/dashboard/mail_transport/**'
      - 'test/standalone/lightek_transactional_mail_test.rb'
      - '.github/workflows/lightek-mail-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-smtp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install public mail test dependencies
        run: gem install --no-document actionmailer:8.0.5.1 actionpack:8.0.5.1 minitest:5.25.4
      - name: Verify actual SMTP submission and guarded Gmail retirement
        run: ruby test/standalone/lightek_transactional_mail_test.rb
