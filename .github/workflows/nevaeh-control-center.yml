name: Nevaeh control center
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'app/**/nevaeh*'
      - 'app/controllers/employee/software_library_controller.rb'
      - 'app/views/employee/software_library/**'
      - 'app/views/shared/_nevaeh_contextual_help.html.erb'
      - 'app/services/gatekeeper/authorization_service.rb'
      - 'docs/nevaeh/**'
      - 'app/**/nevaeh*/**'
      - 'app/services/studio/workers/workspace.rb'
      - 'app/services/script_builder/**'
      - 'app/services/screenplay_engine/**'
      - 'app/services/studio/media_process.rb'
      - 'config/initializers/sidekiq.rb'
      - 'docker/studio-media/**'
      - 'lib/scripts/setup_studio_media.sh'
      - 'app/services/studio/performance/audio_envelope.rb'
      - 'app/views/dymond_dash/shared/_sidebar.html.erb'
      - 'app/services/studio/publishers/**'
      - 'app/services/studio/publishing/**'
      - 'app/jobs/studio_story_pipeline_job.rb'
      - 'app/jobs/studio_rehearsal_job.rb'
      - 'app/services/studio/performance/**'
      - 'app/models/studio_operation.rb'
      - 'app/views/dymond_dash/layouts/**'
      - 'app/jobs/studio_social_publication_poll_job.rb'
      - 'blender/**'
      - 'test/operations/studio_spatial_blender_checks.py'
      - 'test/standalone/studio_story_pipeline_checks.rb'
      - 'test/standalone/studio_social_transport_checks.rb'
      - 'app/services/studio/director/**'
      - 'app/jobs/studio*assembly*'
      - 'app/jobs/studio_directed_voice_job.rb'
      - 'test/standalone/studio_director*'
      - 'test/standalone/campaign_producer*'
      - 'public/nevaeh/**'
      - 'lib/scripts/nevaeh/**'
      - 'public/lightek/nevaeh/**'
      - 'public/lightek/studio-app.js'
      - 'test/standalone/nevaeh*'
      - 'test/javascript/nevaeh*'
      - 'test/operations/nevaeh_package_control_test.py'
      - 'test/operations/nevaeh_voice_container_test.py'
      - 'test/controllers/employee/nevaeh_control_center_test.rb'
      - 'db/migrate/*nevaeh*'
      - '.github/workflows/nevaeh-control-center.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-builder:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      BUNDLE_GEMFILE: test/standalone/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Install application adapter test binaries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify task revisions, typed routing, Dispatch and journal read-back
        run: bundle exec ruby test/standalone/nevaeh_task_builder_checks.rb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/nevaeh-builder-browser" --no-save playwright
          "$RUNNER_TEMP/nevaeh-builder-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify actual builder form and mobile layout
        run: NODE_PATH="$RUNNER_TEMP/nevaeh-builder-browser/node_modules" node test/standalone/nevaeh_task_builder_browser.cjs

  page-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUNDLE_GEMFILE: test/standalone/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Verify page contracts, specialist handoff and execution guards
        run: bundle exec ruby test/standalone/nevaeh_page_worker_checks.rb --name '/NevaehPageWorkerChecks/'
      - name: Verify specialist reports, feedback, isolation and manager recall
        run: bundle exec ruby test/standalone/nevaeh_worker_report_checks.rb --name '/NevaehWorkerReport/'
      - name: Verify JSON Schema, source rereads, manager journal and file ownership
        run: bundle exec ruby test/standalone/nevaeh_reporting_convention_checks.rb --name '/NevaehReportingConventionChecks/'
      - name: Verify runtime UUID reservation and report reference parity
        run: bundle exec ruby test/standalone/nevaeh_runtime_report_parity_checks.rb --name '/NevaehRuntimeReportParityChecks/'
      - name: Verify populated legacy backfill and authoritative journal lookup
        run: bundle exec ruby test/standalone/nevaeh_runtime_backfill_checks.rb --name '/NevaehRuntimeBackfillChecks/'
      - name: Verify workforce lifecycle and current-page context
        run: bundle exec ruby test/standalone/nevaeh_workforce_goal_checks.rb --name '/NevaehWorkforce|NevaehPageContext/'

  voice-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
      - run: gem install sidekiq -v 8.1.7 --no-document
      - name: Verify speech bypasses a blocked default worker
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: ruby test/standalone/nevaeh_voice_queue_test.rb

  voice-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build the CPU voice stage used by the Studio image
        run: docker build --target voice --tag lightek/nevaeh-voice:test docker/studio-media
      - name: Verify Nevaeh name pronunciation rules
        run: python3 -m unittest test.operations.nevaeh_pronunciation_test
      - name: Verify noexec reproduction and actual restricted voice generation
        env:
          NEVAEH_TEST_VOICE_CONTAINER: '1'
        run: python3 -m unittest test.operations.nevaeh_voice_container_test -v

  persistence-and-rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUNDLE_GEMFILE: test/standalone/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - run: bundle exec ruby test/standalone/nevaeh_digital_factory_test.rb
      - run: bundle exec ruby test/standalone/nevaeh_islamic_learning_test.rb --name '/NevaehIslamicLearningTest/'
      - run: bundle exec ruby test/standalone/nevaeh_salah_study_test.rb --name '/NevaehSalahStudyTest/'
      - run: bundle exec ruby test/standalone/nevaeh_manual_learning_test.rb --name '/NevaehManualLearningTest/'
      - run: bundle exec ruby test/standalone/nevaeh_manual_conversation_test.rb --name '/NevaehManualConversationTest/'
      - run: node --test test/javascript/nevaeh_task_inputs_test.cjs
      - name: Install application test binaries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng blender libegl1 libgl1
      - run: bundle exec ruby test/standalone/campaign_producer_checks.rb --name '/CampaignProducerChecks/'
      - run: DIRECTOR_TEST_REAL_SPEECH=1 bundle exec ruby test/standalone/studio_director_producer_checks.rb --name '/StudioDirectorProducerChecks/'
      - run: bundle exec ruby test/standalone/studio_director_finishing_checks.rb --name '/StudioDirectorFinishingChecks/'
      - run: bundle exec ruby test/standalone/studio_story_pipeline_checks.rb --name '/StudioStoryPipelineChecks/'
      - run: bundle exec ruby test/standalone/studio_social_transport_checks.rb --name '/StudioSocialTransportChecks/'
      - run: REHEARSAL_REAL_BLENDER=1 bundle exec ruby test/standalone/nevaeh_stage_rehearsal_checks.rb --name '/NevaehStageRehearsalChecks/'
      - run: python3 -m unittest test.operations.nevaeh_rehearsal_paths_test
      - run: blender --background --factory-startup --python-exit-code 1 --python test/operations/studio_spatial_blender_checks.py
      - run: bundle exec ruby test/standalone/nevaeh_workforce_goal_checks.rb --name '/NevaehWorkforce|NevaehPageContext/'
      - run: bundle exec ruby test/standalone/nevaeh_page_worker_checks.rb --name '/NevaehPageWorkerChecks/'
      - run: bundle exec ruby test/standalone/nevaeh_workforce_expansion_checks.rb --name '/NevaehWorkforceExpansionChecks/'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docker/studio-media/voice/requirements.txt
      - uses: actions/cache@v6
        with:
          path: /tmp/lightek-voice-models
          key: kokoro-v1-int8-ae315a79-voices-bca610b8
      - name: Install and verify offline natural voice dependencies
        run: |
          pip install -r docker/studio-media/voice/requirements.txt
          python3 docker/studio-media/voice/install_models.py /tmp/lightek-voice-models
      - name: Verify real private speech, natural CPU voice and activity states
        env:
          NEVAEH_TEST_REAL_SPEECH: '1'
          NEVAEH_TEST_NATURAL_VOICE: '1'
          LIGHTEK_VOICE_MODELS: /tmp/lightek-voice-models
        run: bundle exec ruby test/standalone/nevaeh_speech_checks.rb --name '/NevaehSpeech/'
      - run: bundle exec ruby test/standalone/nevaeh_os_test.rb
      - run: python3 -m unittest test.operations.nevaeh_package_control_test
      - run: node --check public/nevaeh/workforce.js
      - run: node --check public/nevaeh/stage.js
      - run: node --check public/nevaeh/voice.js
      - run: node --check public/nevaeh/presence.js
      - run: node --check public/nevaeh/os.js
      - run: node --check public/nevaeh/guide.js
      - run: node --check public/lightek/nevaeh/control-center.js
      - run: node --check public/lightek/studio-app.js
      - run: node --check public/lightek/nevaeh/factory.js
      - run: node --check public/lightek/nevaeh/help.js
      - name: Check migration discovery
        run: |
          bundle exec ruby -ractive_record -e 'ActiveRecord::Base.establish_connection(adapter: "sqlite3", database: ":memory:"); m = ActiveRecord::MigrationContext.new("db/migrate").migrations; abort "Duplicate migration versions" unless m.map(&:version).uniq.length == m.length; puts "Migration versions unique"'

  graphical-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/nevaeh-browser" --no-save playwright
          "$RUNNER_TEMP/nevaeh-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise stage and Dashboard assistant with authenticated API fixtures
        run: NODE_PATH="$RUNNER_TEMP/nevaeh-browser/node_modules" node test/standalone/nevaeh_stage_browser.cjs
      - name: Install audio test fixture dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Exercise actual speech playback and mouth synchronization
        run: NODE_PATH="$RUNNER_TEMP/nevaeh-browser/node_modules" node test/standalone/nevaeh_voice_browser.cjs
      - name: Exercise page-specialist task forms and delegation
        run: NODE_PATH="$RUNNER_TEMP/nevaeh-browser/node_modules" node test/standalone/nevaeh_page_workers_browser.cjs
      - name: Exercise SME reports and owner feedback
        run: NODE_PATH="$RUNNER_TEMP/nevaeh-browser/node_modules" node test/standalone/nevaeh_worker_reports_browser.cjs
      - name: Exercise incremental authenticated HLS speech playback
        run: NODE_PATH="$RUNNER_TEMP/nevaeh-browser/node_modules" node test/standalone/nevaeh_playlist_browser.cjs
      - name: Exercise workforce, delegation, goals and removal
        run: NODE_PATH="$RUNNER_TEMP/nevaeh-browser/node_modules" node test/standalone/nevaeh_workforce_browser.cjs
