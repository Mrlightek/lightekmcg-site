name: Lightek PWA flows
on:
  push:
    branches:
      - 'feature/lightek-pwa-completion-*'
  pull_request:
    paths:
      - 'public/lightek/**'
      - 'app/services/lightek_community/**'
      - 'app/services/lightek_pwa/**'
      - 'app/services/studio/**'
      - 'app/controllers/api/**'
      - 'app/controllers/posts_controller.rb'
      - 'app/controllers/communities_controller.rb'
      - 'app/controllers/dashboard/live_broadcasts_controller.rb'
      - 'app/services/gatekeeper/studio_live_policy.rb'
      - 'blender/**'
      - 'docker/studio-media/**'
      - 'app/jobs/**'
      - 'app/channels/studio_broadcast_channel.rb'
      - 'lib/tasks/lightek_pwa.rake'
      - 'lib/tasks/studio_live.rake'
      - 'config/sidekiq.yml'
      - 'lib/scripts/gatekeeper/lightekmcg-site-sidekiq.service'
      - 'app/models/profile.rb'
      - 'app/models/studio_asset.rb'
      - 'app/models/lightek_social/top_person.rb'
      - 'test/operations/studio_transform_test.py'
      - 'test/operations/migration_versions_test.py'
      - 'app/models/community.rb'
      - 'app/models/post.rb'
      - 'db/migrate/**'
      - 'test/standalone/**'
      - 'test/javascript/**'
      - '.github/workflows/pwa-flows.yml'
  workflow_dispatch:
jobs:
  client-and-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Rails test dependencies
        env:
          BUNDLE_GEMFILE: test/standalone/Gemfile
        run: bundle install
      - name: Install media runtimes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg blender python3-numpy
      - name: Database and API integration tests
        env:
          BUNDLE_GEMFILE: test/standalone/Gemfile
        run: |
          bundle exec ruby test/standalone/pwa_http_checks.rb
          bundle exec ruby test/standalone/migration_version_checks.rb
      - name: Actual media ingestion, editing, live and Blender checks
        env:
          BUNDLE_GEMFILE: test/standalone/Gemfile
          LIGHTEK_TEST_BLENDER: '1'
        run: bundle exec ruby test/standalone/media_checks.rb
      - name: Client execution and transform tests
        run: |
          node --test test/javascript/nevaeh-client.test.cjs
          python3 test/operations/studio_transform_test.py
          python3 test/operations/migration_versions_test.py
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/lightek-pwa-browser playwright@1.62.1
          /tmp/lightek-pwa-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser user journeys
        env:
          NODE_PATH: /tmp/lightek-pwa-browser/node_modules
        run: node test/javascript/community-browser.cjs

  native-host:
    name: Native Rails with PostgreSQL and Redis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lightek_pwa_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lightek_pwa_test
      REDIS_URL: redis://127.0.0.1:6379/0
      LIGHTEK_APP_ID: ${{ secrets.LIGHTEK_CI_APP_ID || vars.LIGHTEK_CI_APP_ID }}
      LIGHTEK_APP_KEY: ${{ secrets.LIGHTEK_CI_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require native dependency access
        run: |
          if [ -z "$LIGHTEK_APP_ID" ] || [ -z "$LIGHTEK_APP_KEY" ]; then
            echo "::error::Native host checks require the existing LIGHTEK_CI_APP_ID and LIGHTEK_CI_APP_PRIVATE_KEY credentials."
            exit 1
          fi
      - uses: actions/create-github-app-token@v3
        id: private_repos
        with:
          app-id: ${{ env.LIGHTEK_APP_ID }}
          private-key: ${{ env.LIGHTEK_APP_KEY }}
          owner: lightekmcg
      - name: Configure private Ruby dependencies
        env:
          TOKEN: ${{ steps.private_repos.outputs.token }}
        run: |
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Install actual media runtimes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg blender python3-numpy
      - name: Prepare database and check application loading
        run: bin/rails db:test:prepare zeitwerk:check
      - name: Native Studio, live, social and messaging checks
        run: bin/rails test test/services/studio test/services/lightek_social test/services/lightek_messaging test/integration/live_broadcasts_test.rb test/channels/studio_broadcast_channel_test.rb
