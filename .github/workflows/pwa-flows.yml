name: Lightek PWA flows
on:
  push:
    branches:
      - 'feature/lightek-pwa-completion-*'
      - 'feature/pwa-dashboard-administration-*'
  pull_request:
    paths:
      - 'public/lightek/**'
      - 'app/services/lightek_community/**'
      - 'app/services/lightek_pwa/**'
      - 'app/services/lightek_settings/site_domain.rb'
      - 'lib/tasks/site_binding.rake'
      - 'lib/scripts/gatekeeper/pwa_backend_transfer.py'
      - 'lib/scripts/gatekeeper/create_hosted_site.py'
      - 'lib/scripts/gatekeeper/update_native_installation.py'
      - 'lib/middleware/pwa_member_guard.rb'
      - 'app/models/application_record.rb'
      - 'app/models/concerns/pwa_member_storage_quota.rb'
      - 'script/lightek/website_deploy.sh'
      - 'app/services/studio/**'
      - 'app/controllers/api/**'
      - 'app/controllers/posts_controller.rb'
      - 'app/controllers/registrations_controller.rb'
      - 'app/controllers/pwa_member_sessions_controller.rb'
      - 'app/controllers/identity_onboarding_controller.rb'
      - 'test/standalone/pwa_member_identity_checks.rb'
      - 'app/controllers/communities_controller.rb'
      - 'app/controllers/dashboard/live_broadcasts_controller.rb'
      - 'app/controllers/dashboard/pwa_controller.rb'
      - 'app/controllers/dashboard/pwa_revenue_controller.rb'
      - 'app/controllers/dashboard/hosting_packages_controller.rb'
      - 'app/services/gatekeeper/hosting/retail_pricing.rb'
      - 'app/views/dashboard/hosting_packages/**'
      - 'test/standalone/hosting_retail_pricing_checks.rb'
      - 'app/controllers/commerce_stripe_webhooks_controller.rb'
      - 'app/services/lightek_commerce/webhook_credentials.rb'
      - 'app/views/dashboard/pwa_revenue/**'
      - 'app/models/lightek_pwa/**'
      - 'app/models/concerns/lightek_pwa_site.rb'
      - 'app/views/dashboard/pwa/**'
      - 'config/initializers/lightek_pwa_site.rb'
      - 'config/initializers/lightek_commerce_stripe_routing.rb'
      - 'lib/tasks/tiffany_launch.rake'
      - 'test/integration/pwa_administration_test.rb'
      - 'app/services/gatekeeper/studio_live_policy.rb'
      - 'blender/**'
      - 'docker/studio-media/**'
      - 'app/jobs/**'
      - 'app/channels/studio_broadcast_channel.rb'
      - 'lib/tasks/lightek_pwa.rake'
      - 'lib/tasks/studio_live.rake'
      - 'config/sidekiq.yml'
      - 'lib/scripts/gatekeeper/lightekmcg-site-sidekiq.service'
      - 'app/models/profile.rb'
      - 'app/models/studio_asset.rb'
      - 'app/models/lightek_social/top_person.rb'
      - 'test/operations/studio_transform_test.py'
      - 'test/operations/migration_versions_test.py'
      - 'app/models/community.rb'
      - 'app/models/post.rb'
      - 'db/migrate/**'
      - 'test/standalone/**'
      - 'test/javascript/**'
      - '.github/workflows/pwa-flows.yml'
  workflow_dispatch:
jobs:
  client-and-database:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Rails test dependencies
        env:
          BUNDLE_GEMFILE: test/standalone/Gemfile
        run: bundle install
      - name: Install media runtimes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg blender python3-numpy
      - name: Database and API integration tests
        env:
          BUNDLE_GEMFILE: test/standalone/Gemfile
        run: |
          bundle exec ruby test/standalone/pwa_http_checks.rb
          bundle exec ruby test/standalone/pwa_launch_setup_checks.rb
          bundle exec ruby test/standalone/shared_bank_webhook_checks.rb
          bundle exec ruby test/standalone/hosting_retail_pricing_checks.rb
          bundle exec ruby test/standalone/pwa_registration_checks.rb -n /PwaRegistrationTest/
          bundle exec ruby test/standalone/pwa_pool_operations_checks.rb -n /PwaPoolOperationsTest/
          bash -n lib/scripts/gatekeeper/prepare_member_pool.sh script/lightek/native_website_remote.sh
          bundle exec ruby test/standalone/pwa_member_backend_checks.rb -n '/PwaMemberBackendTest|PwaMemberBoundaryTest/'
          bundle exec ruby test/standalone/pwa_member_runtime_checks.rb -n /PwaMemberRuntimeChecks/
          bundle exec ruby test/standalone/shared_hosting_provisioning_checks.rb -n /SharedHostingProvisioningChecks/
          bundle exec ruby test/standalone/pwa_member_identity_checks.rb -n '/PwaMemberIdentityChecks/'
          bundle exec ruby test/standalone/pwa_view_settlement_checks.rb -n /PwaViewSettlementTest/
          python3 test/scripts/test_pwa_backend_transfer.py
          bundle exec ruby test/standalone/pwa_commercial_checks.rb -n /PwaCommercialTest/
          bundle exec ruby test/standalone/pwa_commercial_http_checks.rb -n /PwaCommercialHttpTest/
          bundle exec ruby test/standalone/pwa_launch_gate_checks.rb -n /PwaLaunchGateTest/
          bundle exec ruby test/standalone/pwa_creator_support_checks.rb -n /PwaCreatorSupportTest/
          bundle exec ruby test/standalone/pwa_youtube_publishing_checks.rb -n /PwaYoutubePublishingTest/
          bundle exec ruby test/standalone/pwa_member_email_checks.rb
          bundle exec ruby test/standalone/nevaeh_pwa_learning_test.rb -n /NevaehPwaLearningTest/
          bundle exec ruby test/standalone/migration_version_checks.rb
          PWA_ADMIN_CAPTURE_DIR=/tmp/lightek-pwa-dashboard bundle exec ruby test/standalone/pwa_administration_checks.rb
      - name: Actual media ingestion, editing, live and Blender checks
        env:
          BUNDLE_GEMFILE: test/standalone/Gemfile
          LIGHTEK_TEST_BLENDER: '1'
        run: bundle exec ruby test/standalone/media_checks.rb
      - name: Client execution and transform tests
        run: |
          node --test test/javascript/nevaeh-client.test.cjs test/javascript/pwa-membership.test.cjs test/javascript/pwa-remote-content.test.cjs test/javascript/pwa-commercial.test.cjs test/javascript/pwa-route-guard.test.cjs test/javascript/pwa-shell-update.test.cjs
          python3 test/operations/studio_transform_test.py
          python3 test/operations/migration_versions_test.py
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/lightek-pwa-browser playwright@1.62.1
          /tmp/lightek-pwa-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser user journeys
        env:
          NODE_PATH: /tmp/lightek-pwa-browser/node_modules
        run: |
          node test/javascript/community-browser.cjs
          node test/javascript/pwa-admin-browser.cjs

  shared-hosting-postgres:
    name: Shared hosting account isolation and dedicated migration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lightek_shared_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
      - name: Install isolated dependencies
        env:
          BUNDLE_GEMFILE: test/standalone/Gemfile
        run: bundle install
      - name: Verify actual PostgreSQL holds and source-to-dedicated media transfer
        env:
          BUNDLE_GEMFILE: test/standalone/Gemfile
          LIGHTEK_SHARED_HOSTING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lightek_shared_test
        run: bundle exec ruby test/standalone/shared_hosting_checks.rb
      - name: Verify original-data export against the repository PostgreSQL schema
        env:
          BUNDLE_GEMFILE: test/standalone/Gemfile
          LIGHTEK_SHARED_HOSTING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lightek_shared_test
          LIGHTEK_SHARED_HOSTING_FULL_SCHEMA: 'true'
        run: bundle exec ruby test/standalone/shared_hosting_checks.rb -n '/round_trip|export_contains/'

  native-host:
    name: Native Rails with PostgreSQL and Redis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lightek_pwa_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lightek_pwa_test
      REDIS_URL: redis://127.0.0.1:6379/0
      LIGHTEK_APP_ID: ${{ secrets.LIGHTEK_CI_APP_ID || vars.LIGHTEK_CI_APP_ID }}
      LIGHTEK_APP_KEY: ${{ secrets.LIGHTEK_CI_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require native dependency access
        run: |
          if [ -z "$LIGHTEK_APP_ID" ] || [ -z "$LIGHTEK_APP_KEY" ]; then
            echo "::error::Native host checks require the existing LIGHTEK_CI_APP_ID and LIGHTEK_CI_APP_PRIVATE_KEY credentials."
            exit 1
          fi
      - uses: actions/create-github-app-token@v2
        id: private_repos
        with:
          app-id: ${{ env.LIGHTEK_APP_ID }}
          private-key: ${{ env.LIGHTEK_APP_KEY }}
          owner: lightekmcg
      - name: Configure private Ruby dependencies
        env:
          TOKEN: ${{ steps.private_repos.outputs.token }}
        run: |
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Install actual media runtimes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg blender python3-numpy
      - name: Prepare database and check application loading
        run: bin/rails db:test:prepare zeitwerk:check
      - name: Native Studio, live, social and messaging checks
        run: bin/rails test test/services/studio test/services/lightek_social test/services/lightek_messaging test/integration/live_broadcasts_test.rb test/integration/pwa_administration_test.rb test/services/gatekeeper/website_deployment_test.rb test/channels/studio_broadcast_channel_test.rb
