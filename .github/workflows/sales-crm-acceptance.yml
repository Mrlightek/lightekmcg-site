      - 'config/routes/sales.rb'
      - 'config/routes/sales_quotes.rb'
      - 'config/routes/lifecycle.rb'
      - 'db/migrate/*lightek_sales*'
      - 'db/migrate/*sales_intake*'
      - 'test/standalone/sales_*'
      - 'test/javascript/sales_crm_browser_test.cjs'
      - '.github/workflows/sales-crm-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  marketing-copilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      BUNDLE_GEMFILE: test/standalone/Gemfile
      MARKETING_PREVIEW_PATH: tmp/marketing-copilot-preview.html
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Verify native marketing kit, CRM follow-ups, caps and journal read-back
        # Feature videos use the existing bounded local media process runner.
        # Their fonts are explicit so a clean runner can produce the same MP4.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          bundle exec ruby test/standalone/marketing_copilot_checks.rb --name '/MarketingCopilotChecks/'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/marketing-browser" --no-save playwright
          "$RUNNER_TEMP/marketing-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify native marketing form and responsive layout
        run: NODE_PATH="$RUNNER_TEMP/marketing-browser/node_modules" node test/javascript/marketing_copilot_browser_test.cjs

  sales:
    runs-on: ubuntu-24.04
    env:
      SALES_PREVIEW_DIR: tmp/sales-preview
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: false
      - name: Install public test dependencies
        run: gem install activerecord:8.0.4 activestorage:8.0.4 actionpack:8.0.4 railties:8.0.4 activejob:8.0.4 sqlite3:2.10.2 minitest:5.27.0 uri:1.1.2 --no-document
      - name: Verify sales lifecycle, routing, consent, isolation and forecasts
        run: ruby test/standalone/campaign_performance_checks.rb
      - name: Verify social prospecting, Vault isolation and message receipts
        run: ruby test/standalone/social_prospecting_checks.rb --name '/test_prospecting_/'
      - name: Verify native CMS audit evidence, permissions, fixes and recovery
        run: ruby test/standalone/website_audit_checks.rb --name '/test_site_|test_audit_/'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/sales-browser" playwright@1.62.1
          "$RUNNER_TEMP/sales-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify native sales screens at desktop and phone widths
        env:
          NODE_PATH: ${{ runner.temp }}/sales-browser/node_modules
        run: node test/javascript/sales_crm_browser_test.cjs
