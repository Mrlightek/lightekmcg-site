name: Social Publishing Acceptance
on:
  pull_request:
    paths:
      - 'app/services/lightek_marketing/**'
      - 'app/controllers/dashboard/social_connections_controller.rb'
      - 'test/services/lightek_marketing/**'
      - '.github/workflows/social-release-acceptance.yml'
  workflow_dispatch:

jobs:
  social_acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lightek_test
      LIGHTEK_APP_ID: ${{ secrets.LIGHTEK_CI_APP_ID || vars.LIGHTEK_CI_APP_ID }}
      LIGHTEK_APP_KEY: ${{ secrets.LIGHTEK_CI_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v3
        id: private_repos
        with:
          app-id: ${{ env.LIGHTEK_APP_ID }}
          private-key: ${{ env.LIGHTEK_APP_KEY }}
          owner: lightekmcg
      - name: Configure private Ruby dependencies
        env:
          TOKEN: ${{ steps.private_repos.outputs.token }}
        run: |
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Prepare test database
        run: bin/rails db:prepare
      - name: Run social publishing acceptance suite
        run: bin/rails test test/services/lightek_marketing
