name: Gatekeeper staging provisioning dashboard
on:
  pull_request:
    paths:
      - 'app/controllers/dashboard/provisioning_requests_controller.rb'
      - 'app/controllers/dashboard/release_assurance_controller.rb'
      - 'app/views/dashboard/release_assurance/**'
      - 'app/services/gatekeeper/compute/**'
      - 'app/services/gatekeeper/website_dns_publication.rb'
      - 'app/services/release_assurance/staging.rb'
      - 'app/services/release_assurance/source.rb'
      - 'config/routes/release_assurance.rb'
      - 'test/standalone/staging_provisioning_release_handoff_checks.rb'
      - 'app/views/dashboard/infrastructure/index.html.erb'
      - 'app/views/dashboard/provisioning_requests/**'
      - 'config/routes.rb'
      - 'test/standalone/staging_provisioning_dashboard_checks.rb'
      - '.github/workflows/staging-provisioning-dashboard.yml'
  push:
    branches: ["release-candidates/**"]
permissions:
  contents: read
jobs:
  authenticated-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - run: gem install 'rails:8.0.5.1' 'minitest:5.25.5' 'sqlite3:2.7.4' 'json:2.21.2' --no-document
      - run: >-
          ruby -e 'gem "json", "2.21.2"; load ARGV.fetch(0)'
          test/standalone/staging_provisioning_release_handoff_checks.rb
      - run: ruby test/standalone/release_assurance_source_checks.rb
