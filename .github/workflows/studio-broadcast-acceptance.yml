name: Studio broadcast acceptance
on:
  pull_request:
    paths:
      - 'app/**/studio/**'
      - 'app/controllers/dashboard/live_broadcasts_controller.rb'
      - 'app/controllers/dashboard/media_studio_controller.rb'
      - 'app/controllers/gatekeeper_controller.rb'
      - 'app/channels/studio_broadcast_channel.rb'
      - 'app/views/dashboard/live_broadcasts/**'
      - 'app/views/dashboard/media_studio/**'
      - 'config/routes.rb'
      - 'public/lightek/live/**'
      - 'public/lightek/broadcast/**'
      - 'test/standalone/**'
      - 'test/javascript/studio_capture_transport_test.cjs'
      - 'db/migrate/20261101010000_create_studio_broadcast_control.rb'
      - '.github/workflows/studio-broadcast-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: test/standalone/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: HTTP, publication, Gatekeeper and simulcast acceptance
        run: bundle exec ruby test/standalone/broadcast_control_checks.rb
      - name: Existing Studio media regression
        run: bundle exec ruby test/standalone/media_checks.rb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/studio-browser" playwright
      - run: "$RUNNER_TEMP/studio-browser/node_modules/.bin/playwright install --with-deps chromium"
      - name: Browser capture transport regression
        env:
          NODE_PATH: ${{ runner.temp }}/studio-browser/node_modules
        run: node test/javascript/studio_capture_transport_test.cjs
