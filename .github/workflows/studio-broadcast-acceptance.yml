name: Studio broadcast acceptance
on:
  pull_request:
    paths:
      - 'app/**/studio/**'
      - 'app/**/studio_workstation*'
      - 'app/views/dashboard/studio_workstations/**'
      - 'docker/studio-workstation/**'
      - 'lib/scripts/*studio_workstation*'
      - 'public/lightek/workstation.*'
      - 'db/migrate/20261107210000_create_studio_workstations.rb'
      - 'app/controllers/dashboard/live_broadcasts_controller.rb'
      - 'app/controllers/dashboard/media_studio_controller.rb'
      - 'app/controllers/gatekeeper_controller.rb'
      - 'app/channels/studio_broadcast_channel.rb'
      - 'app/views/dashboard/live_broadcasts/**'
      - 'app/views/dashboard/media_studio/**'
      - 'config/routes.rb'
      - 'public/lightek/live/**'
      - 'public/lightek/broadcast/**'
      - 'test/standalone/**'
      - 'test/javascript/studio_capture_transport_test.cjs'
      - 'test/javascript/studio_library_test.cjs'
      - 'test/javascript/studio_finishing_test.cjs'
      - 'config/studio/packs/**'
      - 'public/lightek/community-app.css'
      - 'db/migrate/20261111130000_register_studio_production_suite.rb'
      - 'test/javascript/studio_live_library_test.cjs'
      - 'public/lightek/studio-*.js'
      - 'public/lightek/spatial/**'
      - 'examples/spatial-editor/**'
      - 'test/javascript/studio_spatial*'
      - 'test/javascript/prepare_spatial_fixtures.sh'
      - 'public/lightek/studio-authoring.css'
      - 'test/operations/studio_native_tools_test.py'
      - 'app/controllers/api/lightek_pwa_controller.rb'
      - 'app/models/scene_object.rb'
      - 'lib/scripts/setup_studio_media.sh'
      - 'lib/scripts/studio_worker_limits.py'
      - 'lib/scripts/setup_studio_docker_access.py'
      - 'lib/scripts/gatekeeper/deploy_project.sh'
      - 'lib/tasks/studio/**'
      - 'test/javascript/studio_creation_test.cjs'
      - 'app/jobs/studio_asset_save_job.rb'
      - 'docker/studio-media/**'
      - 'db/migrate/20261107153000_register_studio_native_creation.rb'
      - 'db/migrate/20261107190000_register_studio_authoring.rb'
      - 'test/javascript/studio_authoring_test.cjs'
      - 'test/javascript/studio_stage_test.cjs'
      - 'blender/**'
      - 'app/models/artifact.rb'
      - 'test/javascript/studio_native_authoring_test.cjs'
      - 'test/javascript/studio_native_viewport_test.cjs'
      - 'test/javascript/studio_visible_workflows_test.cjs'
      - 'app/jobs/studio_blender_preview_job.rb'
      - 'public/lightek/index.html'
      - 'blender/**'
      - 'services/spatial/**'
      - 'app/services/studio/spatial/**'
      - 'app/controllers/api/studio/spatial_commits_controller.rb'
      - 'test/operations/studio_spatial_service_test.py'
      - 'app/services/blender/**'
      - 'app/models/studio_*.rb'
      - 'app/jobs/studio_blender_demo_import_job.rb'
      - 'config/studio/**'
      - 'test/operations/**'
      - 'test/javascript/studio_native_camera_test.cjs'
      - 'db/migrate/20261101010000_create_studio_broadcast_control.rb'
      - 'db/migrate/20261101020000_register_studio_library_actions.rb'
      - 'db/migrate/20261101030000_register_native_blender_studio.rb'
      - 'db/migrate/20261101040000_register_blender_media_presets.rb'
      - 'db/migrate/20261101050000_register_blender_authoring.rb'
      - '.github/workflows/studio-broadcast-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    env:
      BUNDLE_GEMFILE: test/standalone/Gemfile
    steps:
      - uses: actions/checkout@v4
      - name: Verify single-CPU worker allocation
        run: python3 -m unittest test.operations.studio_worker_limits_test test.operations.studio_media_setup_test test.operations.studio_workstation_units_test
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg blender python3-numpy python3-venv
      - name: Library, HTTP, Gatekeeper, publication and native Blender acceptance
        env:
          LIGHTEK_TEST_BLENDER: '1'
        run: bundle exec ruby test/standalone/blender_authoring_checks.rb
      - run: bundle exec ruby test/standalone/spatial_commit_checks.rb
      - run: bundle exec ruby test/standalone/spatial_publication_checks.rb
      - run: bundle exec ruby test/standalone/spatial_generation_checks.rb
      - name: Production scores and native camera-cut acceptance
        env:
          LIGHTEK_TEST_BLENDER: '1'
        run: bundle exec ruby test/standalone/media_preset_checks.rb --name '/test_production_|test_real_blender_production_score|test_all_recovered|test_presets_create|test_format_and_material|test_idempotency_stale|test_missing_assets/'
      - name: Studio creation and reusable Blender source acceptance
        env:
          LIGHTEK_TEST_BLENDER: '1'
        run: bundle exec ruby test/standalone/studio_creation_checks.rb --name '/test_creation|test_saved_source/'
      - name: Native production authoring and animation acceptance
        env:
          LIGHTEK_TEST_BLENDER: '1'
        run: bundle exec ruby test/standalone/studio_authoring_checks.rb --name /test_authoring/
      - name: Existing Studio media regression
        env:
          LIGHTEK_TEST_BLENDER: '1'
        run: |
          bundle exec ruby test/standalone/timeline_finishing_checks.rb
          bundle exec ruby test/standalone/media_checks.rb
      - name: Create an isolated Python environment for spatial service tests
        run: /usr/bin/python3 -m venv "$RUNNER_TEMP/studio-spatial-python"
      - name: Verify the Blender Python environment
        run: blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python-expr 'import bpy, numpy; print("STUDIO_SYSTEM_NUMPY_READY", numpy.__version__)'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/studio-browser" playwright@1.51.1 jsdom@26.1.0
      - run: "$RUNNER_TEMP/studio-browser/node_modules/.bin/playwright install --with-deps chromium"
      - name: Browser capture transport regression
        env:
          NODE_PATH: ${{ runner.temp }}/studio-browser/node_modules
        run: node test/javascript/studio_capture_transport_test.cjs
      - name: Prepare native stage browser fixture
        run: blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python-expr "import bpy; bpy.context.scene.objects['Cube']['lightek_object_name']='Cube'; bpy.ops.export_scene.gltf(filepath='/tmp/native-viewport-proof.glb', export_format='GLB', export_extras=True)"
      - name: Working library UI and live media sources
        env:
          STUDIO_BROWSER_FIXTURE_WEBM: "1"
          NODE_PATH: ${{ runner.temp }}/studio-browser/node_modules
        run: |
          node test/javascript/studio_creation_test.cjs
          node test/javascript/studio_authoring_test.cjs
          node test/javascript/studio_library_test.cjs
          node test/javascript/studio_finishing_test.cjs
          node test/javascript/studio_live_library_test.cjs
          node test/javascript/studio_stage_test.cjs
          node test/javascript/studio_native_camera_test.cjs
          node test/javascript/studio_native_authoring_test.cjs
          node test/javascript/studio_visible_workflows_test.cjs
      - name: Spatial window, browser composition and real vision models
        env:
          NODE_PATH: ${{ runner.temp }}/studio-browser/node_modules
        run: |
          bash test/javascript/prepare_spatial_fixtures.sh
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python-expr "import bpy; bpy.context.scene.objects['Cube']['lightek_object_name']='Cube'; bpy.ops.export_scene.gltf(filepath='/tmp/native-viewport-proof.glb', export_format='GLB', export_extras=True)"
          LIGHTEK_TEST_BLENDER=1 bundle exec ruby test/standalone/spatial_generation_checks.rb
          node test/javascript/studio_spatial_math_test.cjs
          node test/javascript/studio_spatial_browser_test.cjs
          node test/javascript/studio_spatial_vision_test.cjs
          node test/javascript/studio_spatial_depth_test.cjs
          node test/javascript/studio_spatial_feed_test.cjs
          "$RUNNER_TEMP/studio-spatial-python/bin/python" -m pip install -r services/spatial/requirements.txt
          SPATIAL_TEST_BLENDER="$(command -v blender)" PYTHONPATH="$PWD" "$RUNNER_TEMP/studio-spatial-python/bin/python" -m unittest test.operations.studio_spatial_service_test test.operations.studio_spatial_assets_test test.operations.studio_spatial_setup_test test.operations.studio_spatial_packages_test
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python test/operations/spatial_asset_staging_blender.py
          npm ci --prefix examples/spatial-editor --ignore-scripts
          npm --prefix examples/spatial-editor run check
          npm --prefix examples/spatial-editor test
      - name: Native Blender mesh picking and transform tools
        env:
          NODE_PATH: ${{ runner.temp }}/studio-browser/node_modules
        run: |
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python-expr "import bpy; bpy.context.scene.objects['Cube']['lightek_object_name']='Cube'; bpy.ops.export_scene.gltf(filepath='/tmp/native-viewport-proof.glb', export_format='GLB', export_extras=True)"
          node test/javascript/studio_native_viewport_test.cjs
      - name: Native mesh, sculpt, modifier and graph tools
        run: BLENDER_BIN="$(command -v blender)" python3 -m unittest test/operations/studio_native_tools_test.py
      - name: Blender archive and transform regression
        run: python3 -m unittest test/operations/studio_docker_access_test.py test/operations/studio_media_setup_test.py test/operations/blender_demo_archive_test.py test/operations/studio_transform_test.py test/operations/deploy_checkout_test.py test/operations/deploy_release_bootstrap_test.py
  workstation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUNDLE_GEMFILE: test/standalone/Gemfile
    steps:
      - uses: actions/checkout@v4
      - name: Verify single-CPU worker allocation
        run: python3 -m unittest test.operations.studio_worker_limits_test test.operations.studio_media_setup_test test.operations.studio_workstation_units_test
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg blender python3-numpy python3-venv
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/studio-browser" playwright@1.51.1 jsdom@26.1.0
      - run: "$RUNNER_TEMP/studio-browser/node_modules/.bin/playwright install --with-deps chromium"
      - name: Native workstation access, save, render and publication
        env:
          LIGHTEK_TEST_BLENDER: '1'
        run: bundle exec ruby test/standalone/studio_workstation_checks.rb --name /test_workstation/
      - name: Native project preservation and gateway security
        run: BLENDER_BIN="$(command -v blender)" python3 -m unittest test/operations/studio_workstation_gateway_test.py test/operations/studio_workstation_bridge_test.py
      - name: Native workstation controls
        env:
          NODE_PATH: ${{ runner.temp }}/studio-browser/node_modules
        run: node test/javascript/studio_workstation_test.cjs
      - name: Build isolated native desktop
        run: docker build -t lightek/studio-workstation:20261107 docker/studio-workstation
      - name: Real native Blender desktop and save receipt
        env:
          LIGHTEK_TEST_WORKSTATION: '1'
          NODE_PATH: ${{ runner.temp }}/studio-browser/node_modules
        run: python3 -m unittest test/operations/studio_workstation_container_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-native-desktop
          path: tmp/workstation-desktop.png
          if-no-files-found: ignore
