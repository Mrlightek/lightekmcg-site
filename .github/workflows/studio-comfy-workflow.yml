name: ComfyUI MCP CPU workflow
on:
  pull_request:
    paths:
      - 'app/services/studio/workflows/**'
      - 'app/services/studio/ai/runtime.rb'
      - 'app/services/studio/workers/workspace.rb'
      - 'app/services/lightek_pwa/source_runtime.rb'
      - 'app/services/gatekeeper/fleet/transport.rb'
      - 'app/controllers/api/lightek/pwa/studio_workflows_controller.rb'
      - 'app/jobs/studio_comfy_workflow_job.rb'
      - 'app/javascript/lightek_studio/**'
      - 'lib/comfyui/**'
      - 'lib/scripts/gatekeeper/install_studio_ai.py'
      - 'lib/scripts/setup_studio_ai_access.py'
      - 'config/studio_ai/**'
      - 'script/studio/prove_comfy_workflow.py'
      - 'script/studio/install_local_workflow.py'
      - 'test/standalone/studio_comfy_workflow_checks.rb'
      - 'test/javascript/studio_comfy_workflow_test.cjs'
      - 'test/operations/studio_comfy_nodes_test.py'
      - '.github/workflows/studio-comfy-workflow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BUNDLE_GEMFILE: test/standalone/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media tools and pinned ComfyUI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg blender libegl1 libgl1
          python -m venv "$RUNNER_TEMP/comfy-python"
          git init "$RUNNER_TEMP/comfyui"
          git -C "$RUNNER_TEMP/comfyui" remote add origin https://github.com/Comfy-Org/ComfyUI.git
          git -C "$RUNNER_TEMP/comfyui" fetch --depth=1 origin 30c259cac8c08ff8d015f9aff3151cb525c9b702
          git -C "$RUNNER_TEMP/comfyui" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/comfy-python/bin/pip" install torch==2.7.1 torchvision==0.22.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/comfy-python/bin/pip" install -r "$RUNNER_TEMP/comfyui/requirements.txt" requests==2.32.5 transformers==4.57.1
      - name: Installer, node boundaries and CPU Studio UI
        run: |
          python -m unittest test.operations.studio_ai_setup_test test.operations.studio_comfy_nodes_test
          npm ci --prefix vendor/studio-editors --ignore-scripts --no-audit --no-fund
          node script/studio/build_unified_studio.mjs
          git diff --exit-code -- public/lightek/studio-unified.js
          npm install --prefix "$RUNNER_TEMP/studio-browser" jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/studio-browser/node_modules" node test/javascript/studio_comfy_workflow_test.cjs
          NODE_PATH="$RUNNER_TEMP/studio-browser/node_modules" node test/javascript/studio_genesis_connection_test.cjs
          NODE_PATH="$RUNNER_TEMP/studio-browser/node_modules" node test/javascript/studio_core_access_test.cjs
      - name: Real ComfyUI MCP Blender FFmpeg proof
        env:
          STUDIO_COMFY_PROOF_VIDEO: tmp/comfy-workflow-proof.mp4
        run: |
          "$RUNNER_TEMP/comfy-python/bin/python" script/studio/prove_comfy_workflow.py --comfy-root "$RUNNER_TEMP/comfyui" -- bundle exec ruby test/standalone/studio_comfy_workflow_checks.rb --name '/StudioComfyWorkflowTest/'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: comfy-mcp-cpu-workflow-video
          path: tmp/comfy-workflow-proof.mp4
