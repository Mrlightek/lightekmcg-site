name: Studio native 2D workflow
on:
  pull_request:
    paths:
      - 'app/services/studio/**'
      - 'app/services/nevaeh_os/specialist_context.rb'
      - 'app/services/nevaeh_os/task_builder.rb'
      - 'app/javascript/lightek_studio/**'
      - 'app/jobs/execute_studio_operation_job.rb'
      - 'app/models/studio_operation.rb'
      - 'lib/scripts/studio_layered_renderer.py'
      - 'public/lightek/assets2d/**'
      - 'public/lightek/studio-unified.*'
      - 'test/standalone/studio_native_workflow_checks.rb'
      - 'test/javascript/studio_native_workflow_test.cjs'
      - 'test/operations/studio_layered_renderer_test.py'
      - '.github/workflows/studio-native-workflow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-2d:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: test/standalone/Gemfile
      STUDIO_NATIVE_PROOF_VIDEO: /tmp/lightek-native-2d.mp4
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Install native media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
      - name: Verify isolated workflow and real native video
        run: bundle exec ruby test/standalone/studio_native_workflow_checks.rb --name '/StudioNativeWorkflowTest/'
      - name: Measure parallax in exported pixels
        run: python3 test/operations/studio_layered_renderer_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PWA and Dashboard controls without Genesis
        run: |
          npm ci --prefix vendor/studio-editors --ignore-scripts --no-audit --no-fund
          node script/studio/build_unified_studio.mjs
          git diff --exit-code -- public/lightek/studio-unified.js
          npm install --prefix "$RUNNER_TEMP/studio-native" jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/studio-native/node_modules" node test/javascript/studio_native_workflow_test.cjs
          NODE_PATH="$RUNNER_TEMP/studio-native/node_modules" node test/javascript/studio_genesis_connection_test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-2d-parallax-proof
          path: /tmp/lightek-native-2d.mp4
          if-no-files-found: error
