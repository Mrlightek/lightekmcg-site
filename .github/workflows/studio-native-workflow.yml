name: Studio native 2D workflow
on:
  pull_request:
    paths:
      - 'app/services/studio/**'
      - 'app/services/nevaeh_os/specialist_context.rb'
      - 'app/services/nevaeh_os/task_builder.rb'
      - 'app/javascript/lightek_studio/**'
      - 'app/jobs/execute_studio_operation_job.rb'
      - 'app/models/studio_operation.rb'
      - 'lib/scripts/studio_layered_renderer.py'
      - 'lib/scripts/studio_layered_blender.py'
      - 'public/lightek/assets2d/**'
      - 'public/lightek/studio-unified.*'
      - 'test/standalone/studio_native_workflow_checks.rb'
      - 'test/standalone/studio_character_scene_checks.rb'
      - 'test/standalone/studio_scene_templates_checks.rb'
      - 'test/javascript/studio_scene_templates_test.cjs'
      - 'test/javascript/studio_character_scene_test.cjs'
      - 'blender/create_performer.py'
      - 'blender/runner.py'
      - 'app/jobs/studio_character_scene_job.rb'
      - 'test/javascript/studio_native_workflow_test.cjs'
      - 'test/operations/studio_layered_renderer_test.py'
      - '.github/workflows/studio-native-workflow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-2d:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIGHTEK_TEST_BLENDER: '1'
      LIGHTEK_TEST_CHARACTER_SCENE: '1'
      LIGHTEK_RHUBARB: ${{ runner.temp }}/rhubarb/Rhubarb-Lip-Sync-1.14.0-Linux/rhubarb
      STUDIO_TEMPLATE_PROOF_VIDEO: /tmp/lightek-template-scene.mp4
      STUDIO_CHARACTER_PROOF_VIDEO: /tmp/lightek-character-scene.mp4
      STUDIO_CHARACTER_PROOF_BLEND: /tmp/lightek-character-scene.blend
      STUDIO_NATIVE_PROOF_BLEND: /tmp/lightek-park.blend
      BUNDLE_GEMFILE: test/standalone/Gemfile
      STUDIO_NATIVE_PROOF_VIDEO: /tmp/lightek-native-2d.mp4
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Install native media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick blender espeak-ng
          mkdir -p "$RUNNER_TEMP/rhubarb"
          curl --fail --location --retry 2 https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip -o "$RUNNER_TEMP/rhubarb.zip"
          echo "a9a9074862cff47b2d59b8bf399a678a3b0b74f9452ad6ad94cb292913dd8667  $RUNNER_TEMP/rhubarb.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/rhubarb.zip" -d "$RUNNER_TEMP/rhubarb"
          chmod 755 "$LIGHTEK_RHUBARB"
      - name: Verify isolated workflow and real native video
        run: bundle exec ruby test/standalone/studio_native_workflow_checks.rb --name '/StudioNativeWorkflowTest/'
      - name: Verify a real illustrated character scene with speech
        run: bundle exec ruby test/standalone/studio_character_scene_checks.rb --name '/StudioCharacterSceneTest/'
      - name: Verify templates reach real performed scenes
        run: bundle exec ruby test/standalone/studio_scene_templates_checks.rb --name '/StudioSceneTemplatesTest/'
      - name: Measure parallax in exported pixels
        run: python3 test/operations/studio_layered_renderer_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PWA and Dashboard controls without Genesis
        run: |
          npm ci --prefix vendor/studio-editors --ignore-scripts --no-audit --no-fund
          node script/studio/build_unified_studio.mjs
          git diff --exit-code -- public/lightek/studio-unified.js
          npm install --prefix "$RUNNER_TEMP/studio-native" jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/studio-native/node_modules" node test/javascript/studio_native_workflow_test.cjs
          NODE_PATH="$RUNNER_TEMP/studio-native/node_modules" node test/javascript/studio_genesis_connection_test.cjs
          NODE_PATH="$RUNNER_TEMP/studio-native/node_modules" node test/javascript/studio_character_scene_test.cjs
          NODE_PATH="$RUNNER_TEMP/studio-native/node_modules" node test/javascript/studio_scene_templates_test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-2d-parallax-proof
          path: |
            /tmp/lightek-native-2d.mp4
            /tmp/lightek-park.blend
            /tmp/lightek-character-scene.mp4
            /tmp/lightek-character-scene.blend
            /tmp/lightek-template-scene.mp4
          if-no-files-found: error
