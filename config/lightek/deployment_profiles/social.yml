schema_version: 1
profile: social
product: lightek-site
mode: customer_isolated
defaults:
  site_name: "My Community"
  tagline: "A place for your community to connect."
  locale: en
  timezone: UTC
  pages:
    - { slug: home, title: Home, published: true }
    - { slug: about, title: About, published: false }
    - { slug: contact, title: Contact, published: false }
  sections:
    - { page: home, key: hero, title: Welcome, body: "Customize your site to get started." }
modules:
  cms: true
  contact: true
  billing: false
  community: true
  studio: false
  streaming: false
