# config/schedule.yml
susu_cycle_reminders:
  cron: "0 9 * * *" # Daily at 9:00 AM
  class: "SusuCycleReminderJob"
  queue: default

susu_cycle_advance:
  cron: "0 0 * * 0" # Every Sunday at midnight
  class: "SusuCycleAdvanceJob"
  queue: default

nevaeh_historical_backlog:
  cron: "*/5 * * * *"
  class: "NevaehIntelligences::ProcessBacklogJob"
  queue: default
  active_job: true
