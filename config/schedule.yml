  cron: "*/5 * * * *"
  class: "LightekPwa::PublicationSweepJob"
  description: "Recover pending content-reference notifications without copying member content"
  active_job: true

pwa_commercial_recovery:
  cron: '*/5 * * * *'
  class: 'LightekPwa::CommercialRecoveryJob'
  queue: default
