# config/schedule.yml
susu_cycle_reminders:
  cron: "0 9 * * *" # Daily at 9:00 AM
  class: "SusuCycleReminderJob"
  queue: default

gatekeeper_fleet_recovery:
  cron: "* * * * *"
  class: "Gatekeeper::Fleet::SweepJob"
  queue: default

gatekeeper_hosting_recovery:
  cron: "* * * * *"
  class: "Gatekeeper::Hosting::RecoveryJob"
  queue: default

susu_cycle_advance:
  cron: "0 0 * * 0" # Every Sunday at midnight
  class: "SusuCycleAdvanceJob"
  queue: default

nevaeh_historical_backlog:
  cron: "*/5 * * * *"
  class: "NevaehIntelligences::ProcessBacklogJob"
  queue: default
  active_job: true

gatekeeper_device_heartbeat_sweep:
  cron: "*/1 * * * *"
  class: "GatekeeperDeviceHeartbeatSweepJob"
  queue: default

nevaeh_workflow_sweep:
  cron: "* * * * *"
  class: "NevaehIntelligences::WorkflowSweepJob"
  queue: default
  active_job: true

nevaeh_factory_training_recovery:
  cron: "* * * * *"
  class: "NevaehIntelligences::FactorySweepJob"
  queue: default
  active_job: true

lightek_reservations_recovery:
  cron: "*/5 * * * *"
  class: "LightekReservations::SweepJob"
  queue: default
  active_job: true

lightek_merchant_payouts:
  cron: "15 * * * *"
  class: "LightekCommerce::ScheduledPayoutsJob"
  queue: default
  active_job: true

lightek_session_media_reconciliation:
  cron: "* * * * *"
  class: "LightekSessions::SweepJob"
  queue: default
  active_job: true
