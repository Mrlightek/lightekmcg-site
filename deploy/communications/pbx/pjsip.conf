[lightek-carrier]
type=transport
protocol=udp
bind=0.0.0.0:5060

[lightek-devices]
type=transport
protocol=tls
bind=0.0.0.0:5061
method=tlsv1_2
cert_file=/etc/asterisk/lightek/tls-fullchain.pem
priv_key_file=/etc/asterisk/lightek/tls-key.pem

