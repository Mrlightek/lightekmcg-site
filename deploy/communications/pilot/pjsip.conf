[loopback]
type=transport
protocol=udp
bind=127.0.0.1:5060

[2001]
type=endpoint
transport=loopback
context=lightek-pilot
disallow=all
allow=ulaw
direct_media=no
auth=pilot-auth
aors=2001

[2001]
type=aor
max_contacts=1

[pilot-auth]
type=auth
auth_type=userpass
username=2001
password=__SIP_PASSWORD__
