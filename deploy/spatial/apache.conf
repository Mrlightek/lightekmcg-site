# Inside this instance's existing TLS vhost; before Passenger / Rails routes.
# Requires proxy, proxy_http and proxy_wstunnel. Keep the sidecar HTTP port private.
ProxyPass "/studio-spatial/ws" "ws://127.0.0.1:8095/ws" retry=0 timeout=300
ProxyPassReverse "/studio-spatial/ws" "ws://127.0.0.1:8095/ws"
