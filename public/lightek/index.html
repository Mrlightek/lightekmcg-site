/* Lightek Studio visual 3D workspace */
.studio-live-layout{
  display:grid;
  grid-template-columns:
    minmax(190px,240px)
    minmax(420px,1fr)
    minmax(280px,320px);
  gap:1px;
  min-height:610px;
  margin-top:16px;
  border:1px solid var(--ln);
  background:var(--ln);
  overflow:hidden;
  border-radius:5px
}

.studio-live-layout>.studio-panel{
  border:0;
  border-radius:0;
  margin:0;
  min-width:0;
  overflow:auto
}

.studio-live-outliner{
  background:var(--s1)
}

.studio-live-inspector{
  background:var(--s1)
}

.studio-viewport{
  position:relative;
  min-width:0;
  min-height:610px;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  background:#08090d;
  overflow:hidden
}

.studio-viewport-toolbar{
  min-height:45px;

  display:flex;
  align-items:center;

  gap:12px;
  border-bottom:1px solid var(--ln);
  background:#0d0f14;
  z-index:4
}

.studio-viewport-tools{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap
}

.studio-viewport-toolbar button{
  appearance:none;
  border:1px solid var(--ln);
  background:#141720;
  color:var(--fg);
  padding:6px 9px;
  border-radius:3px;
  cursor:pointer;
  font-size:10px;
  line-height:1;
  letter-spacing:.05em;
  text-transform:uppercase
}

.studio-viewport-toolbar button:hover{
  border-color:#d6a94a88
}

.studio-viewport-toolbar button.on{
  border-color:var(--gd);
  color:var(--gd);

}

.studio-viewport-divider{
  width:1px;
  height:23px;
  background:var(--ln);
  margin:0 3px
}

.studio-viewport-status{
  min-width:0;
  color:var(--mu);
  font-size:10px;

  text-overflow:ellipsis;
  text-align:right

  min-height:520px;

.studio-viewport-canvas:focus-visible{

    inset 0 0 0 1px

}

.studio-viewport-canvas canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none
}

.studio-viewport-hint{
  min-height:28px;

  align-items:center;
  padding:5px 9px;
  border-top:1px solid var(--ln);

  color:var(--mu);
  font-size:9px;
  line-height:1.35

.studio-live-layout-fallback{

.studio-viewport{

const studioTemplateIntents=()=>{
  const seen=new Set();

  return [
    {key:"all",label:"All"},
    ...STUDIO_TEMPLATE_GALLERY
      .filter(template=>{
        if(seen.has(template.intent)){
          return false
        }

        seen.add(template.intent);
        return true
      })
      .map(template=>({
        key:template.intent,
        label:template.intent_label
      }))
  ]
};

const studioTemplateByKey=key=>
  STUDIO_TEMPLATE_GALLERY.find(
    template=>template.key===key
  )||null;

const studioTemplateSelected=()=>{
  const filtered=
    studioTemplateFiltered();

  return (
    studioTemplateByKey(
      ST.templateSelectedKey
    )||
    filtered[0]||
    STUDIO_TEMPLATE_GALLERY[0]||
    null
  )
};

const studioTemplateFiltered=()=>{
  const intent=
    ST.templateIntent||"all";

  const query=
    ST.templateQuery
      .trim()
      .toLowerCase();

  return STUDIO_TEMPLATE_GALLERY.filter(template=>{
    if(
      intent!=="all"&&
      template.intent!==intent
    ){
      return false
    }

    if(!query){
      return true
    }

    return [
      template.name,
      template.intent_label,
      template.promise,
      template.description,
      template.format,
      template.best_for,
      ...(template.tags||[])
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase()
      .includes(query)
  })
};

const studioTemplateEnsureSelection=()=>{
  const filtered=
    studioTemplateFiltered();

  if(!filtered.length){
    return null
  }

  const current=
    filtered.find(
      template=>
        template.key===
        ST.templateSelectedKey
    );

  if(current){
    return current
  }

  ST.templateSelectedKey=
    filtered[0].key;

  return filtered[0]
};

    category=>category.key===key
  )||null;

const studioLibraryCategoryCount=key=>

  ).length;

const studioLibraryFilteredAssets=()=>{
  const category=
    ST.libraryCategory||"all";

  const query=
    ST.libraryQuery
      .trim()
      .toLowerCase();

  return STUDIO_LIBRARY_ASSETS.filter(asset=>{
    if(
      category!=="all"&&
      asset.category!==category
    ){
      return false
    }

    if(!query){
      return true
    }

    return [
      asset.name,
      asset.kind,
      asset.description,
      ...(asset.tags||[]),
      studioLibraryCategory(asset.category)?.label
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase()
      .includes(query)
  })
};

const studioLibraryCategoryGroups=()=>{
  const groups=[];

  studioLibraryCategories().forEach(category=>{
    let group=
      groups.find(
        item=>item.name===category.group
      );

    if(!group){
      group={
        name:category.group,
        categories:[]
      };

      groups.push(group)
    }

    group.categories.push(category)
  });

  return groups
};

  const category=

const studioMutationObject=(
  result,
  existing={}
)=>{
  const returned=
    result?.object||{};

  return {
    ...existing,

    id:
      Number(
        returned.id||
        result?.object_id||
        existing.id
      ),

    name:
      returned.name||
      existing.name||
      "Scene Object",

    object_type:
      returned.object_type||
      returned.type||
      existing.object_type||
      "cube",

    definition:
      returned.definition
        ?JSON.parse(
            JSON.stringify(
              returned.definition
            )
          )
        :JSON.parse(
            JSON.stringify(
              existing.definition||{}
            )
          )
  }
};

const studioApplyLifecycleMutation=(
  payload,
  result
)=>{
  const record=
    studioSceneRecord(
      payload.scene_id
    );

  if(!record?.scene){
    return null
  }

  const scene=
    record.scene;

  scene.objects=
    Array.isArray(
      scene.objects
    )
      ?scene.objects
      :[];

  const mutation=
    result?.mutation;

  if(
    mutation==="created"||
    mutation==="duplicated"
  ){
    const object=
      studioMutationObject(
        result
      );

    scene.objects=
      scene.objects.filter(
        existing=>
          Number(existing.id)!==
          Number(object.id)
      );

    scene.objects.push(
      object
    );

    ST.selectedObjectId=
      Number(
        object.id
      );

    scene.object_count=
      scene.objects.length;

    return object
  }

  if(
    mutation==="destroyed"
  ){
    const id=
      Number(
        result.object_id||
        payload.object_id
      );

    scene.objects=
      scene.objects.filter(
        object=>
          Number(object.id)!==id
      );

    if(
      Number(
        ST.selectedObjectId
      )===id
    ){
      ST.selectedObjectId=null
    }

    scene.object_count=
      scene.objects.length;

    return null
  }

  return null
};

const studioExecuteLifecycleMutation=async(
  capability,
  payload,
  successMessage
)=>{
  if(ST.busy){
    return null
  }

  ST.busy=true;
  ST.mutationStatus=
    "Nevaeh is applying the Studio mutation…";

  try{
    const response=
      await nevaeh.execute({
        capability,
        payload
      });

    if(
      response.status!=="completed"
    ){
      throw new Error(
        `Studio mutation returned ${response.status||"unknown status"}`
      )
    }

    const result=
      response.result||{};

    studioApplyLifecycleMutation(
      payload,
      result
    );

    ST.mutationStatus=
      successMessage;

    return result
  }catch(error){
    ST.mutationStatus=
      error.message||
      "Studio mutation failed";

    throw error
  }finally{
    /*
     * This is a LOCAL PWA reconciliation only.
     *
     * ST.loaded stays true, so AF.studio ->
     * studioLoad() immediately returns.
     *
     * No bootstrap request.
     * No Loading Studio screen.
     *
     * Replacing the current 3D DOM also lets the
     * viewport MutationObserver rebuild directly
     * from the canonical ST scene state.
     */
    ST.busy=false;

    if(
      location.hash.startsWith(
        "#/studio"
      )
    ){
      render(1)
    }
  }
};

const studioExecuteMutation=async(
  capability,
  payload,
  successMessage
)=>{
  if(ST.busy)return null;

  ST.busy=true;
  ST.mutationStatus="";

  render(1);

  try{
    const response=
      await nevaeh.execute({
        capability,
        payload
      });

    if(
      response.status!=="completed"
    ){
      throw new Error(
        `Studio mutation returned ${response.status||"unknown status"}`
      )
    }

    const result=
      response.result||{};

    if(
      result.object_id &&
      result.mutation!=="destroyed"
    ){
      ST.selectedObjectId=
        Number(
          result.object_id
        )
    }

    if(
      result.mutation==="destroyed"
    ){
      ST.selectedObjectId=null
    }

    ST.mutationStatus=
      successMessage;

    ST.loaded=false;

    await A.studioLoad(
      true
    );

    return result
  }catch(error){
    ST.mutationStatus=
      error.message||
      "Studio mutation failed";

    throw error
  }finally{
    ST.busy=false;

    if(
      location.hash.startsWith(
        "#/studio"
      )
    ){
      render(1)
    }
  }
};

const messageTime=value=>{
  if(!value) return '';

  const date=
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return ''
  }

  const now=
    new Date();

  const sameDay=
    date.getFullYear()===now.getFullYear()&&
    date.getMonth()===now.getMonth()&&
    date.getDate()===now.getDate();

  return new Intl.DateTimeFormat(
    "en-US",
    sameDay
      ?{
          hour:"numeric",
          minute:"2-digit"
        }
      :{
          month:"short",
          day:"numeric"
        }
  ).format(date)
};

window.LightekStudioViewportBridge={
  snapshot:()=>{
    const sceneId=
      studioCurrentSceneId();

    const record=
      studioSceneRecord(
        sceneId
      );

    if(!record?.scene){
      return null
    }

    return {
      sceneId:
        Number(
          record.scene.id
        ),

      sceneName:
        record.scene.name,

      objects:
        cloneStudioViewportValue(
          record.scene.objects||[]
        ),

      selectedObjectId:
        ST.selectedObjectId===null
          ?null
          :Number(
              ST.selectedObjectId
            ),

      workspaceMode:
        ST.workspaceMode,

      busy:
        Boolean(
          ST.busy
        )
    }
  },

  selectObject:id=>{
    const next=
      id===null||
      id===undefined
        ?null
        :Number(id);

    if(
      next===
      ST.selectedObjectId
    ){
      return
    }

    ST.selectedObjectId=
      next;

    render(1)
  },

  commitTransform:async(
    objectId,
    attributes
  )=>{
    const sceneId=
      studioCurrentSceneId();

    if(!sceneId){
      throw new Error(
        "Studio scene is unavailable"
      )
    }

    if(ST.busy){
      return null
    }

    ST.busy=true;
    ST.mutationStatus="";

    try{
      const response=
        await nevaeh.execute({
          capability:
            "studio.scene_object.transform",

          payload:{
            scene_id:
              Number(sceneId),

            object_id:
              Number(objectId),

            attributes
          }
        });

      if(
        response.status!=="completed"
      ){
        throw new Error(
          `Studio mutation returned ${response.status||"unknown status"}`
        )
      }

      const result=
        response.result||{};

      const record=
        studioSceneRecord(
          sceneId
        );

      const objects=
        record?.scene?.objects;

      if(Array.isArray(objects)){
        const index=
          objects.findIndex(
            object=>
              Number(object.id)===
              Number(objectId)
          );

        if(index>=0){
          const existing=
            objects[index];

          const returned=
            result.object||{};

          objects[index]={
            ...existing,

            id:
              Number(
                returned.id||
                result.object_id||
                existing.id
              ),

            name:
              returned.name||
              existing.name,

            object_type:
              returned.object_type||
              returned.type||
              existing.object_type,

            definition:
              returned.definition
                ?JSON.parse(
                    JSON.stringify(
                      returned.definition
                    )
                  )
                :{
                    ...(existing.definition||{}),

                    location:
                      Array.isArray(
                        attributes.location
                      )
                        ?[...attributes.location]
                        :existing.definition?.location,

                    rotation:
                      Array.isArray(
                        attributes.rotation
                      )
                        ?[...attributes.rotation]
                        :existing.definition?.rotation,

                    scale:
                      Array.isArray(
                        attributes.scale
                      )
                        ?[...attributes.scale]
                        :existing.definition?.scale
                  }
          }
        }
      }

      ST.selectedObjectId=
        Number(
          result.object_id||
          objectId
        );

      ST.mutationStatus=
        "Transform saved";

      return result
    }catch(error){
      ST.mutationStatus=
        error.message||
        "Studio transform failed";

      throw error
    }finally{
      ST.busy=false
    }
  }
};

studioCreateObject:async()=>{
  const sceneId=
    studioCurrentSceneId();

  const record=
    studioSceneRecord(
      sceneId
    );

  if(!record)return;

  const type=
    document.getElementById(
      "studio-create-type"
    )?.value;

  if(!type)return;

  const typedName=
    document.getElementById(
      "studio-create-name"
    )?.value
      ?.trim();

  const label=
    type
      .split("_")
      .map(
        part=>
          part.charAt(0).toUpperCase()+
          part.slice(1)
      )
      .join(" ");

  const count=
    (
      record.scene.objects||[]
    ).filter(
      object=>
        object.object_type===type
    ).length+1;

  await studioExecuteLifecycleMutation(
    "studio.scene_object.create",
    {
      scene_id:
        sceneId,

      name:
        typedName||
        `${label} ${count}`,

      object_type:
        type,

      allow_overlap:
        false
    },
    `${label} created`
  )
},

  const name=

studioLoad:async(force=false)=>{
  if(
    ST.loading||
    (
      ST.loaded&&
      !force
    )||
    (
      ST.error&&
      !force
    )
  ){
    return
  }

  ST.loading=true;
  ST.error="";

  if(
    location.hash.startsWith(
      "#/studio"
    )
  ){
    render(1)
  }

  try{
    const response=
      await nevaeh.execute({
        capability:
          "studio.pwa.bootstrap",

        payload:{}
      });

    ST.projects=
      response.result?.projects||
      response.projects||
      [];

    ST.objectTypes=
      response.result?.object_types||
      response.object_types||
      [];

    ST.loaded=true;
  }catch(error){
    ST.error=
      error.message||
      "Studio could not be loaded";

    ST.loaded=false;
  }finally{
    ST.loading=false;

    if(
      location.hash.startsWith(
        "#/studio"
      )
    ){
      render(1)
    }
  }
},

  A.studioLoad(true)

messagesLoad:async()=>{

    document.querySelector(
      "#messages-list"
    );

  const detail=
    document.querySelector(
      "#messages-detail"
    );

  if(!list||!detail) return;

  if(MS.items.length){
    list.innerHTML=
      messageRows(MS.items);
  }else{
    list.innerHTML=`
      <div class="msg-status">
        Loading conversations…
      </div>
    `;
  }

  try{
    const response=
      await nevaeh.execute({
        capability:"messages.list",
        payload:{}
      });

    MS.items=
      response.result?.conversations||
      response.conversations||
      [];

    if(
      MS.selected &&
      !MS.items.some(
        item=>
          Number(item.id)===
          Number(MS.selected)
      )
    ){
      MS.selected=null;
      MS.detail=null;
    }

    list.innerHTML=
      messageRows(MS.items);

    if(MS.compose){
      detail.innerHTML=
        messageStartPanel(
          MS.compose
        );

      await A.messageOpen(
        MS.selected
      );

      detail.innerHTML=
        messageEmptyPanel();
    }
  }catch(error){
    list.innerHTML=`
      <div class="msg-empty" style="min-height:360px">
        <div>
          <span class="eb">Messages unavailable</span>
          <h2>Couldn’t load conversations.</h2>
          <p>${E(error.message||"Please try again.")}</p>
        </div>
      </div>
    `;

},

messageOpen:async id=>{
  const conversationId=
    Number(id);

  const detail=
    document.querySelector(
      "#messages-detail"
    );

  const list=
    document.querySelector(
      "#messages-list"
    );

  const shell=
    document.querySelector(
      "#messages-shell"
    );

  if(
    !conversationId||
    !detail
  ) return;

  MS.selected=
    conversationId;

  MS.detail=
    null;

  MS.groupManage=false;
  MS.groupManageAdd=false;
  MS.groupManageQuery="";
  MS.groupManagePeople=[];
  MS.groupManageSelected=
    new Set();

  const token=
    ++MS.openToken;

  shell?.classList.add(
    "has-open"
  );

  if(list){
    list.innerHTML=
      messageRows(MS.items);
  }

  detail.innerHTML=`
    <div class="msg-status">
      Loading conversation…
    </div>
  `;

  try{
    const response=
      await nevaeh.execute({
        capability:"messages.show",

        payload:{
          conversation_id:
            conversationId
        }
      });

    if(token!==MS.openToken){
      return;
    }

    const conversation=
      response.result?.conversation||
      response.conversation||
      null;

    if(!conversation){
      throw new Error(
        "Conversation response was empty"
      )
    }

    MS.detail=
      conversation;

    detail.innerHTML=
      messageConversationPanel(
        conversation
      );

    messageScrollBottom();

    if(
      Number(
        conversation.unread_count||
        0
      )>0
    ){
      try{
        await nevaeh.execute({
          capability:
            "messages.mark_read",

          payload:{
            conversation_id:
              conversationId
          }
        });

        const row=
          MS.items.find(
            item=>
              Number(item.id)===
              conversationId
          );

        if(row){
          row.unread_count=0;
        }

        conversation.unread_count=0;

        if(list){
          list.innerHTML=
            messageRows(
              MS.items
            );
        }
      }catch(error){
        console.warn(
          "[Lightek Messages] mark read failed",
          error
        );
      }
    }
  }catch(error){
    if(token!==MS.openToken){
      return;
    }

    detail.innerHTML=`
      <div class="msg-empty">
        <div>
          <span class="eb">Conversation unavailable</span>
          <h2>Couldn’t open this message.</h2>
          <p>${E(error.message||"Please try again.")}</p>
        </div>
      </div>
    `;
  }
},

messageGroupPeopleLoad:async()=>{
  const list=
    document.querySelector(
      "#message-group-manage-people"
    );

  if(
    !list||
    !MS.groupManage||
    !MS.groupManageAdd||
    MS.detail?.kind!=="group"
  ){
    return;
  }

  const token=
    ++MS.groupManageToken;

  list.innerHTML=`
    <div class="msg-status">
      Loading people…
    </div>
  `;

  try{
    const response=
      await nevaeh.execute({
        capability:
          "social.people.recommend",

        payload:{
          query:
            MS.groupManageQuery,

          limit:
            30
        }
      });

    if(
      token!==
      MS.groupManageToken
    ){
      return;
    }

    const activeIds=
      new Set(
        (MS.detail.participants||[])
          .map(entry=>
            Number(
              entry.profile?.id
            )
          )
          .filter(Boolean)
      );

    const myId=
      Number(
        meProfile()?.id
      );

    const recommendations=
      response.result?.recommendations||
      response.recommendations||
      [];

    MS.groupManagePeople=
      recommendations
        .map(record=>({
          ...(record?.profile||{}),

          relationship:
            record?.relationship||{},

          recommendation:
            record?.recommendation||{}
        }))
        .filter(profile=>{
          const profileId=
            Number(profile.id);

          return (
            profileId &&
            profileId!==myId &&
            !activeIds.has(
              profileId
            )
          )
        });

    list.innerHTML=
      messageGroupPeopleRows(
        MS.groupManagePeople
      );
  }catch(error){
    if(
      token!==
      MS.groupManageToken
    ){
      return;
    }

    list.innerHTML=`
      <div
        class="msg-empty"
        style="min-height:180px"
      >
        <div>
          <span class="eb">
            People unavailable
          </span>

          <h2>
            Couldn't load profiles.
          </h2>

          <p>
            ${E(error.message||"Please try again.")}
          </p>
        </div>
      </div>
    `;
  }
},

messageSend:async button=>{
  if(MS.sending){
    return;
  }

  const input=
    document.querySelector(
      "#message-compose"
    );

  const body=
    input?.value.trim()||
    "";

  const conversationId=
    Number(
      button?.dataset?.id||
      MS.selected
    );

  if(
    !body||
    !conversationId||
    !input
  ){
    return;
  }

  const sendButton=
    document.querySelector(
      '[data-a="messageSend"]'
    );

  MS.sending=true;

  if(sendButton){
    sendButton.disabled=true;
    sendButton.textContent=
      "Sending…";
  }

  try{
    const response=
      await nevaeh.execute({
        capability:"messages.send",

        payload:{
          conversation_id:
            conversationId,

          body:body
        }
      });

    const message=
      response.result?.message||
      response.message||
      null;

    const conversation=
      response.result?.conversation||
      response.conversation||
      null;

    input.value="";

    if(
      MS.detail &&
      Number(MS.detail.id)===
        conversationId &&
      message
    ){
      MS.detail.messages=
        [
          ...(MS.detail.messages||[]),
          message
        ];

      MS.detail.last_message=
        message;

      MS.detail.last_message_at=
        message.created_at;

      const detail=
        document.querySelector(
          "#messages-detail"
        );

      if(detail){
        detail.innerHTML=
          messageConversationPanel(
            MS.detail
          );
      }
    }

    const index=
      MS.items.findIndex(
        item=>
          Number(item.id)===
          conversationId
      );

    if(index>=0){
      const current=
        MS.items.splice(
          index,
          1
        )[0];

      Object.assign(
        current,
        conversation||{},
        {
          last_message:
            message||
            current.last_message,

          last_message_at:
            message?.created_at||
            conversation?.last_message_at||
            current.last_message_at,

          unread_count:
            0
        }
      );

      MS.items.unshift(
        current
      );
    }

    const list=
      document.querySelector(
        "#messages-list"
      );

    if(list){
      list.innerHTML=
        messageRows(
          MS.items
        );
    }

    messageScrollBottom();

    requestAnimationFrame(()=>{
      document
        .querySelector(
          "#message-compose"
        )
        ?.focus();
    });
  }catch(error){
    toast(
      error.message||
      "Message could not be sent"
    );
  }finally{
    MS.sending=false;

    const currentButton=
      document.querySelector(
        '[data-a="messageSend"]'
      );

    if(currentButton){
      currentButton.disabled=false;
      currentButton.textContent=
        "Send";
    }
  }
},

pub:()=>{CS.pr=1;render(1);const t=setInterval(()=>{CS.pr+=14;if(CS.pr>=100){clearInterval(t);CS.done=1}if(location.hash=='#/create')render(1)},180)},
again:()=>{Object.assign(CS,{s:0,type:'',title:'',desc:'',file:'',dest:new Set(['My Space']),pr:0,done:0});render()}};
function render(keep){const y=scrollY,[r,a]=location.hash.slice(2).split('/'),k=R[r]?r:'home';app.innerHTML=R[k](a);document.querySelectorAll('#primary-nav a').forEach(x=>x.classList.toggle('on',x.dataset.r==(k=='community'?'communities':k)));if(AF[k])AF[k](a);scrollTo(0,keep?y:0);app.classList.remove('fade');if(!keep){void app.offsetWidth;app.classList.add('fade')}}
app.addEventListener('click',e=>{const s=e.target.closest('[data-sc]');if(s){e.preventDefault();document.getElementById(s.dataset.sc)?.scrollIntoView({behavior:'smooth'});return}const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b,e)});
app.addEventListener('input',e=>{
  const n=e.target.name;

  const studioCreateField=
    e.target.dataset?.studioCreateField;

  const studioLibrarySearch=
    e.target.dataset?.studioLibrarySearch;

  const studioTemplateSearch=
    e.target.dataset?.studioTemplateSearch;

  if(studioTemplateSearch==="query"){
    ST.templateQuery=
      e.target.value;

    studioTemplateEnsureSelection();
    studioTemplateRefresh()
  }

  if(studioLibrarySearch==="query"){
    ST.libraryQuery=
      e.target.value;

    studioLibraryRefreshResults()
  }

  if(studioCreateField==="name"){
    ST.createName=
      e.target.value;
  }

  if(studioCreateField==="brief"){
    ST.createBrief=
      e.target.value;
  }

  if(
    n=='title'||
    n=='desc'
  ){
    CS[n]=e.target.value;
    const p=$('#pv');
    if(p)p.innerHTML=pv()
  }

  if(
    e.target.id==='message-group-title'
  ){
    MS.groupTitle=
      e.target.value;
  }

  if(
    e.target.id==='message-people-search'
  ){
    MS.query=
      e.target.value;

    clearTimeout(
      MS.searchTimer
    );

    MS.searchTimer=
      setTimeout(
        ()=>A.messagePeopleLoad(),
        220
      );
  }
  if(
    e.target.id==='message-group-manage-search'
  ){
    MS.groupManageQuery=
      e.target.value;

    clearTimeout(
      MS.groupManageSearchTimer
    );

    MS.groupManageSearchTimer=
      setTimeout(
        ()=>A.messageGroupPeopleLoad(),
        220
      );
  }
});

app.addEventListener('change',e=>{if(e.target.id=='fi'){CS.file=e.target.files[0]?.name||'';render(1)}});
app.addEventListener('keydown',e=>{
  const desktopKeyboard=
    window.matchMedia(
      '(hover: hover) and (pointer: fine)'
    ).matches;

  if(
    e.key==='Enter'&&
    e.target.id==='message-compose'&&
    !e.shiftKey&&
    !e.isComposing&&
    desktopKeyboard
  ){
    e.preventDefault();
    A.messageSend();
    return
  }

  if(
    e.key==='Enter'&&
    e.target.id==='ci'
  ){
    A.send()
  }
});
addEventListener('keydown',e=>{if(!location.hash.startsWith('#/clips')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key;if(k=='ArrowDown'||k=='j'){e.preventDefault();A.cn()}else if(k=='ArrowUp'||k=='k'){e.preventDefault();A.cp()}else if(k=='l')A.tg({dataset:{k:'like:'+S.clip}});else if(k=='s')A.tg({dataset:{k:'save:'+S.clip}})});
addEventListener('lightek.bootstrap.ready',event=>{
  window.LightekIdentity=event.detail?.identity||null;

  const p=meProfile();

  if(p){
    S.mode=
      p.profile_type==='creator'
        ?'creator'
        :p.profile_type==='organization'
          ?'org'
          :'person';
  }

  const route=
    location.hash
      .replace(/^#\//,'')
      .split('/')[0];

  if(
    route==='space'||
    route==='create'||
    route==='studio'||
    route==='messages'
  ){
    render();
  }
});
