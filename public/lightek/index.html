.money-shell{
  padding:72px 0 96px
}
.money-head{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:48px;
  align-items:end;
  margin-bottom:48px
}

  font-size:clamp(44px,6vw,78px);
  line-height:1
}
.money-head p{
  color:var(--mu);
  max-width:520px
}
.money-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:2px

  display:block;
  background:var(--s1);
  padding:30px;
  min-height:220px;
  border-top:2px solid transparent

  border-color:var(--gd)

  font:400 28px Georgia,serif;
  margin:8px 0

  color:var(--mu)

  background:var(--s2)

  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  margin-top:22px;
  max-width:560px

  background:var(--bg);
  border:1px solid var(--ln);
  padding:13px 14px
}

  margin-top:22px;
  max-width:560px;
  border-top:1px solid var(--ln)
}

  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:10px 0;
  border-bottom:1px solid var(--ln)
}
.quote-line.total{
  color:var(--gd);
  font-weight:700
}

  .money-head,
  .money-grid{
    grid-template-columns:1fr
  }

  .money-card.primary{
    grid-column:auto
  }

  .quote-form{
    grid-template-columns:1fr
  }
