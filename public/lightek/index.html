/* STUDIO-107 semantic Scene Graph: presentation only */
.studio-semantic-graph{display:grid;gap:8px;min-width:0}
.studio-semantic-tools{display:flex;align-items:center;justify-content:space-between;gap:7px;color:var(--mu);font-size:10px}
.studio-semantic-tools button{color:var(--gd);border:1px solid var(--ln);background:transparent;border-radius:4px;padding:7px 8px;cursor:pointer;font:inherit}
.studio-semantic-root{font-size:12px;font-weight:700;padding:10px 8px;border-bottom:1px solid var(--ln);overflow-wrap:anywhere}
.studio-semantic-root small{display:block;padding:4px 0 0 16px;color:var(--mu);font-size:9px;font-weight:400}
.studio-semantic-group{min-width:0;border:1px solid var(--ln);border-radius:5px;overflow:hidden}
.studio-semantic-category{display:flex;width:100%;align-items:center;gap:7px;background:#ffffff05;color:inherit;border:0;cursor:pointer;text-align:left;padding:10px 9px;min-height:40px}
.studio-semantic-category strong{min-width:0;flex:1;font-size:11px;overflow-wrap:anywhere}
.studio-semantic-category small{color:var(--mu);font-size:9px;white-space:nowrap}
.studio-semantic-caret{color:var(--gd)}
.studio-semantic-children{padding:4px 3px 6px 12px;border-top:1px solid var(--ln)}
.studio-semantic-element{display:flex;align-items:center;min-width:0;border-radius:4px}
.studio-semantic-label,.studio-semantic-fixture{min-width:0;display:flex;align-items:center;gap:7px;flex:1;text-align:left;background:none;color:inherit;border:1px solid transparent;padding:8px 4px;min-height:42px;border-radius:4px;cursor:pointer}
.studio-semantic-label span:last-child,.studio-semantic-fixture span:last-child{min-width:0}
.studio-semantic-label b,.studio-semantic-fixture b{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.studio-semantic-label small,.studio-semantic-fixture small{display:block;font-size:9px;color:var(--mu);margin-top:2px}
.studio-semantic-label.on,.studio-semantic-fixture.on,.studio-semantic-element.on{background:#d6a94a14;border-color:#d6a94a44}
.studio-semantic-fixture{width:100%;color:#bebbb5}
.studio-semantic-fixture small{font-style:italic}
.studio-semantic-element.is-muted{opacity:.45}
.studio-semantic-eye{flex:0 0 30px;border:0;background:transparent;color:var(--mu);min-height:40px;cursor:pointer}
.studio-semantic-empty,.studio-semantic-note{color:var(--mu);font-size:10px;line-height:1.45;padding:9px 6px}
.studio-semantic-note{border-top:1px solid var(--ln)}
.studio-semantic-category:focus-visible,.studio-semantic-label:focus-visible,.studio-semantic-fixture:focus-visible,.studio-semantic-eye:focus-visible,.studio-semantic-tools button:focus-visible{outline:2px solid var(--gd);outline-offset:1px}
@media(max-width:600px){.studio-semantic-label,.studio-semantic-fixture,.studio-semantic-category{min-height:44px}}

/* Lightek Studio visual 3D workspace */
.studio-live-layout{
  display:grid;
  grid-template-columns:
    minmax(190px,240px)
    minmax(420px,1fr)
    minmax(280px,320px);
  gap:1px;
  min-height:610px;
  margin-top:16px;
  border:1px solid var(--ln);
  background:var(--ln);
  overflow:hidden;
  border-radius:5px
}

.studio-live-layout>.studio-panel{
  border:0;
  border-radius:0;
  margin:0;
  min-width:0;
  overflow:auto
}

.studio-live-outliner{
  background:var(--s1)
}

.studio-live-inspector{
  background:var(--s1)
}

.studio-viewport{
  position:relative;
  min-width:0;
  min-height:610px;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  background:#08090d;
  overflow:hidden
}

.studio-viewport-toolbar{
  min-height:45px;
  padding:7px 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid var(--ln);
  background:#0d0f14;
  z-index:4
}

.studio-viewport-tools{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap
}

.studio-viewport-toolbar button{
  appearance:none;
  border:1px solid var(--ln);
  background:#141720;
  color:var(--fg);
  padding:6px 9px;
  border-radius:3px;
  cursor:pointer;
  font-size:10px;
  line-height:1;
  letter-spacing:.05em;
  text-transform:uppercase
}

.studio-viewport-toolbar button:hover{
  border-color:#d6a94a88
}

.studio-viewport-toolbar button.on{
  border-color:var(--gd);
  color:var(--gd);
  background:#d6a94a12
}

.studio-viewport-divider{
  width:1px;
  height:23px;
  background:var(--ln);
  margin:0 3px
}

.studio-viewport-status{
  min-width:0;
  color:var(--mu);
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:right
}

.studio-viewport-canvas{
  position:relative;
  min-height:520px;
  min-width:0;
  overflow:hidden;
  outline:none;
  background:
    radial-gradient(
      circle at 50% 40%,
      #161a24 0,
      #08090d 62%
    )
}

.studio-viewport-canvas:focus-visible{
  box-shadow:
    inset 0 0 0 1px
    var(--gd)
}

.studio-viewport-canvas canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none
}

.studio-viewport-hint{
  min-height:28px;
  display:flex;
  align-items:center;
  padding:5px 9px;
  border-top:1px solid var(--ln);
  background:#0d0f14;
  color:var(--mu);
  font-size:9px;
  line-height:1.35
}

.studio-live-layout-fallback{
  grid-template-columns:1fr;
  min-height:610px
}

.studio-live-layout-fallback
.studio-viewport{
  min-height:610px
}

@media(max-width:1020px){
  .studio-live-layout{
    grid-template-columns:1fr;
    min-height:0
  }

  .studio-live-outliner{
    max-height:260px
  }

  .studio-live-inspector{
    max-height:none
  }

  .studio-viewport{
    min-height:520px
  }

  .studio-viewport-canvas{
    min-height:440px
  }

  .studio-viewport-toolbar{
    align-items:flex-start;
    flex-direction:column
  }

  .studio-viewport-status{
    text-align:left;
    width:100%
  }
}

){

const studioTemplateConfigOverrideKey=(fixtureKey,decisionKey)=>
  `${fixtureKey}:${decisionKey}`;

const studioTemplateConfigMode=(fixture,decision)=>{
  const key=
    studioTemplateConfigOverrideKey(
      fixture.key,
      decision.key
    );

  return (
    ST.templateConfigOverrides[key]||
    decision.mode
  )
};

const studioTemplateConfigItems=mode=>{
  const fixture=
    studioTemplateConfigFixture();

  return fixture.decisions.filter(
    decision=>
      studioTemplateConfigMode(
        fixture,
        decision
      )===mode
  )
};

const studioTemplateConfigCounts=()=>{
  const variables=

  const preserved=
    studioTemplateConfigItems(
      "preserved"

  return {
    variables,
    preserved,
    total:variables+preserved
  }
};

const studioTemplateIntents=()=>{
  const seen=new Set();

  return [
    {key:"all",label:"All"},
    ...STUDIO_TEMPLATE_GALLERY
      .filter(template=>{
        if(seen.has(template.intent)){
          return false
        }

        seen.add(template.intent);
        return true
      })
      .map(template=>({
        key:template.intent,
        label:template.intent_label
      }))
  ]
};

const studioTemplateByKey=key=>
  STUDIO_TEMPLATE_GALLERY.find(
    template=>template.key===key
  )||null;

const studioTemplateSelected=()=>{
  const filtered=
    studioTemplateFiltered();

  return (
    studioTemplateByKey(
      ST.templateSelectedKey
    )||
    filtered[0]||
    STUDIO_TEMPLATE_GALLERY[0]||
    null
  )
};

const studioTemplateFiltered=()=>{
  const intent=
    ST.templateIntent||"all";

  const query=
    ST.templateQuery
      .trim()
      .toLowerCase();

  return STUDIO_TEMPLATE_GALLERY.filter(template=>{
    if(
      intent!=="all"&&
      template.intent!==intent
    ){
      return false
    }

    if(!query){
      return true
    }

    return [
      template.name,
      template.intent_label,
      template.promise,
      template.description,
      template.format,
      template.best_for,
      ...(template.tags||[])
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase()
      .includes(query)
  })
};

const studioTemplateEnsureSelection=()=>{
  const filtered=
    studioTemplateFiltered();

  if(!filtered.length){
    return null
  }

  const current=
    filtered.find(
      template=>
        template.key===
        ST.templateSelectedKey
    );

  if(current){
    return current
  }

  ST.templateSelectedKey=
    filtered[0].key;

  return filtered[0]
};

const studioLibraryCategories=()=>
  [...STUDIO_LIBRARY_CATEGORIES].sort(
    (a,b)=>Number(a.order||0)-Number(b.order||0)

const studioLibraryCategory=key=>
  studioLibraryCategories().find(
    category=>category.key===key
  )||null;

const studioLibraryCategoryCount=key=>
  STUDIO_LIBRARY_ASSETS.filter(
    asset=>asset.category===key
  ).length;

const studioLibraryFilteredAssets=()=>{
  const category=
    ST.libraryCategory||"all";

  const query=
    ST.libraryQuery
      .trim()
      .toLowerCase();

  return STUDIO_LIBRARY_ASSETS.filter(asset=>{
    if(
      category!=="all"&&
      asset.category!==category
    ){
      return false
    }

    if(!query){
      return true
    }

    return [
      asset.name,
      asset.kind,
      asset.description,
      ...(asset.tags||[]),
      studioLibraryCategory(asset.category)?.label
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase()
      .includes(query)
  })
};

const studioLibraryCategoryGroups=()=>{
  const groups=[];

  studioLibraryCategories().forEach(category=>{
    let group=
      groups.find(
        item=>item.name===category.group
      );

    if(!group){
      group={
        name:category.group,
        categories:[]
      };

      groups.push(group)
    }

    group.categories.push(category)
  });

  return groups
};

const studioMutationObject=(
  result,
  existing={}
)=>{
  const returned=
    result?.object||{};

  return {
    ...existing,

    id:
      Number(
        returned.id||
        result?.object_id||
        existing.id
      ),

    name:
      returned.name||
      existing.name||
      "Scene Object",

    object_type:
      returned.object_type||
      returned.type||
      existing.object_type||
      "cube",

    definition:
      returned.definition
        ?JSON.parse(
            JSON.stringify(
              returned.definition
            )
          )
        :JSON.parse(
            JSON.stringify(
              existing.definition||{}
            )
          )
  }
};

const studioApplyLifecycleMutation=(
  payload,
  result
)=>{
  const record=
    studioSceneRecord(
      payload.scene_id
    );

  if(!record?.scene){
    return null
  }

  const scene=
    record.scene;

  scene.objects=
    Array.isArray(
      scene.objects
    )
      ?scene.objects
      :[];

  const mutation=
    result?.mutation;

  if(
    mutation==="created"||
    mutation==="duplicated"
  ){
    const object=
      studioMutationObject(
        result
      );

    scene.objects=
      scene.objects.filter(
        existing=>
          Number(existing.id)!==
          Number(object.id)
      );

    scene.objects.push(
      object
    );

    ST.selectedObjectId=
      Number(
        object.id
      );

    scene.object_count=
      scene.objects.length;

    return object
  }

  if(
    mutation==="destroyed"
  ){
    const id=
      Number(
        result.object_id||
        payload.object_id
      );

    scene.objects=
      scene.objects.filter(
        object=>
          Number(object.id)!==id
      );

    if(
      Number(
        ST.selectedObjectId
      )===id
    ){
      ST.selectedObjectId=null
    }

    scene.object_count=
      scene.objects.length;

    return null
  }

  return null
};

const studioExecuteLifecycleMutation=async(
  capability,
  payload,
  successMessage
)=>{
  if(ST.busy){
    return null
  }

  ST.busy=true;
  ST.mutationStatus=
    "Nevaeh is applying the Studio mutation…";

  try{
    const response=
      await nevaeh.execute({
        capability,
        payload
      });

    if(
      response.status!=="completed"
    ){
      throw new Error(
        `Studio mutation returned ${response.status||"unknown status"}`
      )
    }

    const result=
      response.result||{};

    studioApplyLifecycleMutation(
      payload,
      result
    );

    ST.mutationStatus=
      successMessage;

    return result
  }catch(error){
    ST.mutationStatus=
      error.message||
      "Studio mutation failed";

    throw error
  }finally{
    /*
     * This is a LOCAL PWA reconciliation only.
     *
     * ST.loaded stays true, so AF.studio ->
     * studioLoad() immediately returns.
     *
     * No bootstrap request.
     * No Loading Studio screen.
     *
     * Replacing the current 3D DOM also lets the
     * viewport MutationObserver rebuild directly
     * from the canonical ST scene state.
     */
    ST.busy=false;

    if(
      location.hash.startsWith(
        "#/studio"
      )
    ){
      render(1)
    }
  }
};

const studioExecuteMutation=async(
  capability,
  payload,
  successMessage
)=>{
  if(ST.busy)return null;

  ST.busy=true;
  ST.mutationStatus="";

  render(1);

  try{
    const response=
      await nevaeh.execute({
        capability,
        payload
      });

    if(
      response.status!=="completed"
    ){
      throw new Error(
        `Studio mutation returned ${response.status||"unknown status"}`
      )
    }

    const result=
      response.result||{};

    if(
      result.object_id &&
      result.mutation!=="destroyed"
    ){
      ST.selectedObjectId=
        Number(
          result.object_id
        )
    }

    if(
      result.mutation==="destroyed"
    ){
      ST.selectedObjectId=null
    }

    ST.mutationStatus=
      successMessage;

    ST.loaded=false;

    await A.studioLoad(
      true
    );

    return result
  }catch(error){
    ST.mutationStatus=
      error.message||
      "Studio mutation failed";

    throw error
  }finally{
    ST.busy=false;

    if(
      location.hash.startsWith(
        "#/studio"
      )
    ){
      render(1)
    }
  }
};

const messageTime=value=>{
  if(!value) return '';

  const date=
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return ''
  }

  const now=
    new Date();

  const sameDay=
    date.getFullYear()===now.getFullYear()&&
    date.getMonth()===now.getMonth()&&
    date.getDate()===now.getDate();

  return new Intl.DateTimeFormat(
    "en-US",
    sameDay
      ?{
          hour:"numeric",
          minute:"2-digit"
        }
      :{
          month:"short",
          day:"numeric"
        }
  ).format(date)
};

const messagePeer=conversation=>{
  const myId=
    Number(meProfile()?.id);

  return (conversation.participants||[])
    .map(entry=>entry.profile)
    .find(profile=>Number(profile?.id)!==myId)||
    null
};

const messageConversationMeta=conversation=>{
  if(conversation.kind==="group"){
    return `${Number(conversation.participant_count||0)} members`
  }

  const peer=
    messagePeer(conversation);

  return peer?.display_handle||"Direct message"
};

const messageGroupManagementPanel=conversation=>{
  const myId=
    Number(
      meProfile()?.id
    );

  const currentRole=
    conversation.current_role||
    "member";

  const owner=
    currentRole==="owner";

  const manager=
    owner||
    currentRole==="admin";

  const participants=
    conversation.participants||
    [];

  if(!manager){
    return ""
  }

  return `
    <section class="msg-group-manage">
      <div class="msg-group-manage-head">
        <div>
          <span class="eb">
            Group governance
          </span>

          <h3>

            ${owner
              ?"You control administrators and membership."
              :"You can add people and manage regular members."}
          </p>
        </div>

        <button
          class="btn sm ${MS.groupManageAdd?"on":""}"
          data-a="messageGroupAddMode"
          type="button"
        >
          ${MS.groupManageAdd
            ?"Close add people"
            :"Add people"}
        </button>
      </div>

      ${MS.groupManageAdd
        ?`
          <div class="msg-group-add">
            <label class="fld">
              <span>
                Find people to add or re-add
              </span>

              <input
                id="message-group-manage-search"
                value="${E(MS.groupManageQuery)}"
                placeholder="Search by name or @handle"
                autocomplete="off"
              >
            </label>

            <div id="message-group-manage-people">
              <div class="msg-status">
                Loading people…
              </div>
            </div>

            <div class="msg-start-footer">
              <p id="message-group-manage-count">
                ${MS.groupManageSelected.size} selected
              </p>

              <button
                class="btn p"
                data-a="messageGroupAddSelected"
                type="button"
              >
                Add selected
              </button>
            </div>
          </div>
        `
        :""}

      <div class="msg-group-roster">
        ${participants.map(entry=>{
          const profile=
            entry.profile||{};

          const profileId=
            Number(profile.id);

          const role=
            entry.role||
            "member";

          const mine=
            profileId===myId;

          const canPromote=
            owner &&
            !mine &&
            role==="member";

          const canDemote=
            owner &&
            !mine &&
            role==="admin";

          const canRemove=
            !mine &&
            role!=="owner" &&
            (

                currentRole==="admin" &&
                role==="member"

          return `
            <div class="msg-group-member">

              <span class="msg-group-member-copy">
                <b>
                  ${E(profile.name||"Lightek Member")}

                </b>

                <small>
                  ${E(profile.display_handle||"")}
                  <span class="msg-group-role">
                    ${E(role)}
                  </span>
                </small>
              </span>

              <span class="msg-group-member-actions">
                ${canPromote
                  ?`
                    <button
                      class="btn sm"
                      data-a="messageGroupPromoteAdmin"
                      data-id="${profileId}"
                      type="button"
                    >
                      Make admin
                    </button>
                  `
                  :""}

                ${canDemote
                  ?`
                    <button
                      class="btn sm"
                      data-a="messageGroupDemoteAdmin"
                      data-id="${profileId}"
                      type="button"
                    >
                      Demote admin
                    </button>
                  `
                  :""}

                ${canRemove
                  ?`
                    <button
                      class="btn sm rel-block"
                      data-a="messageGroupRemoveMember"
                      data-id="${profileId}"
                      data-name="${E(profile.name||"this member")}"
                      type="button"
                    >
                      Remove
                    </button>
                  `
                  :""}
              </span>
            </div>
          `
        }).join("")}
      </div>
    </section>
  `
};

const socialRelationshipActions=relationship=>{
  const profile=
    relationship?.profile||{};

  const profileId=
    Number(profile.id);

  const friendship=
    relationship?.friendship||null;

  const buttons=[];

  if(relationship?.following){
    buttons.push(`
      <button
        class="btn p on"
        data-a="socialUnfollow"
        data-id="${profileId}"
        type="button"
      >
        Unfollow
      </button>
    `);
  }else{
    buttons.push(`
      <button
        class="btn p"
        data-a="socialFollow"
        data-id="${profileId}"
        type="button"
      >
        Follow
      </button>
    `);
  }

  if(relationship?.friend){
    buttons.push(`
      <button
        class="btn on"
        type="button"
        disabled
        aria-disabled="true"
      >
        Friends
      </button>
    `);

    if(friendship?.id){
      buttons.push(`
        <button
          class="btn sm"
          data-a="socialFriendEnd"
          data-friendship-id="${Number(friendship.id)}"
          type="button"
        >
          End friendship
        </button>
      `);
    }
  }else if(
    friendship?.status==="pending" &&
    friendship?.direction==="incoming"
  ){
    buttons.push(`
      <button
        class="btn"
        data-a="socialFriendRespond"
        data-friendship-id="${Number(friendship.id)}"
        data-response="accept"
        type="button"
      >
        Accept friend
      </button>
    `);

    buttons.push(`
      <button
        class="btn sm"
        data-a="socialFriendRespond"
        data-friendship-id="${Number(friendship.id)}"
        data-response="decline"
        type="button"
      >
        Decline
      </button>
    `);
  }else if(
    friendship?.status==="pending" &&
    friendship?.direction==="outgoing"
  ){
    buttons.push(`
      <button
        class="btn on"
        type="button"
        disabled
        aria-disabled="true"
      >
        Friend request sent
      </button>
    `);
  }else{
    buttons.push(`
      <button
        class="btn"
        data-a="socialFriendRequest"
        data-id="${profileId}"
        type="button"
      >
        Add friend
      </button>
    `);
  }

  buttons.push(`
    <button
      class="btn"
      data-a="socialMessage"
      data-id="${profileId}"
      type="button"
    >
      Message
    </button>
  `);

  buttons.push(`
    <button
      class="btn rel-block"
      data-a="socialBlock"
      data-id="${profileId}"
      type="button"
    >
      Block
    </button>
  `);

  return `
    <div class="rel-actions">
      ${buttons.join("")}
    </div>
  `
};

const socialProfilePanel=relationship=>{
  const profile=
    relationship?.profile||{};

  const profileId=
    Number(profile.id);

  const reasons=
    Array.isArray(
      relationship?.reasons
    )
      ?relationship.reasons.filter(Boolean)
      :[];

  const mutuals=
    Array.isArray(
      relationship?.mutuals
    )
      ?relationship.mutuals
      :[];

  const strength=
    relationship?.strength||null;

  const mutualCount=
    Number(
      relationship?.mutual_count||0
    );

  const degree=
    Number(
      relationship?.degree||0
    );

  const meta=[];

  if(profile.display_handle){
    meta.push(
      E(profile.display_handle)
    );
  }

  if(profile.profile_type){
    meta.push(
      E(
        String(profile.profile_type)
          .replace(/_/g," ")
      )
    );
  }

  if(relationship?.follows_you){
    meta.push("Follows you");
  }

  if(mutualCount){
    meta.push(
      `${mutualCount} mutual ${mutualCount===1?"connection":"connections"}`
    );
  }

  const summary=
    reasons.length
      ?reasons.join(" · ")
      :"You have not built much shared context yet.";

  const strengthSignals=
    strength
      ?[
          [
            "Reciprocity",
            strength.reciprocity
          ],
          [
            "Continuity",
            strength.continuity
          ],
          [
            "Context",
            strength.context_diversity
          ],
          [
            "Shared experience",
            strength.shared_experience
          ],
          [
            "Recency",
            strength.recency
          ],
          [
            "Confidence",
            strength.confidence
          ]
        ]
      :[];

  return `
    ${idh({
      i:profileId||1,
      z:120,
      avatar:
        profileAvatar(
          profile,
          120
        ),
      eb:
        "Lightek Space",
      t:
        E(
          profile.name||
          "Lightek Member"
        ),
      p:
        E(summary),
      meta:
        meta.length
          ?meta
          :["Lightek member"],
      b:
        socialRelationshipActions(
          relationship
        )
    })}

    <div class="wrap rel-shell">
      <div class="rel-grid">

        <section class="rel-card">
          <span class="eb">
            Relationship
          </span>

          <h2>
            How you're connected
          </h2>

          <p>
            Lightek keeps the dimensions separate instead
            of flattening a human relationship into one score.
          </p>

          <div class="rel-tags">
            ${
              reasons.length
                ?reasons
                  .map(reason=>
                    `<span class="rel-tag">${E(reason)}</span>`
                  )
                  .join("")
                :`
                  <span class="rel-tag">
                    New connection
                  </span>
                `
            }

            ${
              degree>1
                ?`
                  <span class="rel-tag">
                    ${degree}-degree network path
                  </span>
                `
                :""
            }
          </div>
        </section>

        <section class="rel-card">
          <span class="eb">
            Mutual network
          </span>

          <h2>
            ${
              mutualCount
                ?`${mutualCount} mutual ${mutualCount===1?"connection":"connections"}`
                :"No mutual connections yet"
            }
          </h2>

          ${
            mutuals.length
              ?`
                <div class="rel-mutuals">
                  ${mutuals.map(mutual=>`
                    <a
                      class="rel-mutual"
                      href="#/space/${Number(mutual.id)}"
                    >
                      ${profileAvatar(mutual,36)}

                      <span>
                        <b>
                          ${E(mutual.name||"Lightek Member")}
                        </b>

                        <small>
                          ${E(mutual.display_handle||"")}
                        </small>
                      </span>
                    </a>
                  `).join("")}
                </div>
              `
              :`
                <p>
                  Your graphs do not currently overlap.
                </p>
              `
          }
        </section>

        ${
          strengthSignals.length
            ?`
              <section class="rel-card rel-wide">
                <span class="eb">
                  Relationship signals
                </span>

                <h2>
                  What the network has observed
                </h2>

                <div class="rel-signals">
                  ${strengthSignals.map(([label,value])=>`
                    <div class="rel-signal">
                      <small>
                        ${E(label)}
                      </small>

                      <strong>
                        ${Math.round(
                          Math.max(
                            0,
                            Math.min(
                              1,
                              Number(value||0)
                            )
                          ) * 100
                        )}%
                      </strong>
                    </div>
                  `).join("")}
                </div>
              </section>
            `
            :""
        }

      </div>
    </div>
  `
};

const cloneStudioViewportValue=value=>{
  if(value===undefined){
    return undefined
  }

  return JSON.parse(
    JSON.stringify(value)
  )
};

window.LightekStudioViewportBridge={
  snapshot:()=>{
    const sceneId=
      studioCurrentSceneId();

    const record=
      studioSceneRecord(
        sceneId
      );

    if(!record?.scene){
      return null
    }

    return {
      sceneId:
        Number(
          record.scene.id
        ),

      sceneName:
        record.scene.name,

      objects:
        cloneStudioViewportValue(
          record.scene.objects||[]
        ),

      selectedObjectId:
        ST.selectedObjectId===null
          ?null
          :Number(
              ST.selectedObjectId
            ),

      workspaceMode:
        ST.workspaceMode,

      busy:
        Boolean(
          ST.busy
        )
    }
  },

  selectObject:id=>{
    const next=
      id===null||
      id===undefined
        ?null
        :Number(id);

    if(
      next===
      ST.selectedObjectId
    ){
      return
    }

    ST.selectedObjectId=
      next;

    render(1)
  },

  commitTransform:async(
    objectId,
    attributes
  )=>{
    const sceneId=
      studioCurrentSceneId();

    if(!sceneId){
      throw new Error(
        "Studio scene is unavailable"
      )
    }

    if(ST.busy){
      return null
    }

    ST.busy=true;
    ST.mutationStatus="";

    try{
      const response=
        await nevaeh.execute({
          capability:
            "studio.scene_object.transform",

          payload:{
            scene_id:
              Number(sceneId),

            object_id:
              Number(objectId),

            attributes
          }
        });

      if(
        response.status!=="completed"
      ){
        throw new Error(
          `Studio mutation returned ${response.status||"unknown status"}`
        )
      }

      const result=
        response.result||{};

      const record=
        studioSceneRecord(
          sceneId
        );

      const objects=
        record?.scene?.objects;

      if(Array.isArray(objects)){
        const index=
          objects.findIndex(
            object=>
              Number(object.id)===
              Number(objectId)
          );

        if(index>=0){
          const existing=
            objects[index];

          const returned=
            result.object||{};

          objects[index]={
            ...existing,

            id:
              Number(
                returned.id||
                result.object_id||
                existing.id
              ),

            name:
              returned.name||
              existing.name,

            object_type:
              returned.object_type||
              returned.type||
              existing.object_type,

            definition:
              returned.definition
                ?JSON.parse(
                    JSON.stringify(
                      returned.definition
                    )
                  )
                :{
                    ...(existing.definition||{}),

                    location:
                      Array.isArray(
                        attributes.location
                      )
                        ?[...attributes.location]
                        :existing.definition?.location,

                    rotation:
                      Array.isArray(
                        attributes.rotation
                      )
                        ?[...attributes.rotation]
                        :existing.definition?.rotation,

                    scale:
                      Array.isArray(
                        attributes.scale
                      )
                        ?[...attributes.scale]
                        :existing.definition?.scale
                  }
          }
        }
      }

      ST.selectedObjectId=
        Number(
          result.object_id||
          objectId
        );

      ST.mutationStatus=
        "Transform saved";

      return result
    }catch(error){
      ST.mutationStatus=
        error.message||
        "Studio transform failed";

      throw error
    }finally{
      ST.busy=false
    }
  }
};

    studioSceneRecord(
      sceneId

    document.getElementById(
      "studio-create-type"

  if(!type)return;

  const typedName=
    document.getElementById(
      "studio-create-name"
    )?.value
      ?.trim();

  const label=
    type
      .split("_")
      .map(
        part=>
          part.charAt(0).toUpperCase()+
          part.slice(1)
      )
      .join(" ");

  const count=
    (
      record.scene.objects||[]
    ).filter(
      object=>
        object.object_type===type
    ).length+1;

  await studioExecuteLifecycleMutation(
    "studio.scene_object.create",
    {
      scene_id:
        sceneId,

      name:
        typedName||
        `${label} ${count}`,

      object_type:
        type,

      allow_overlap:
        false
    },

  )

studioSaveObject:async()=>{

    studioCurrentSceneId();

  const record=
    studioSceneRecord(
      sceneId
    );

  if(!record)return;

  const object=
    studioSelectedObject(
      record.scene
    );

  if(!object)return;

  const vector=name=>
    [0,1,2].map(axis=>{
      const input=
        document.querySelector(
          `[data-studio-vector="${name}"][data-axis="${axis}"]`
        );

      const value=
        Number(
          input?.value
        );

      return Number.isFinite(value)
        ?value
        :0
    });

  const name=
    document.getElementById(
      "studio-object-name"
    )?.value
      ?.trim()||
    object.name;

  const overlap=
    Boolean(
      document.getElementById(
        "studio-object-overlap"
      )?.checked
    );

  await studioExecuteMutation(
    "studio.scene_object.transform",
    {
      scene_id:
        sceneId,

      object_id:
        Number(
          object.id
        ),

      attributes: {
        name,
        allow_overlap:
          overlap,

        location:
          vector(
            "location"

studioLoad:async(force=false)=>{
  if(
    ST.loading||
    (
      ST.loaded&&
      !force
    )||
    (
      ST.error&&
      !force
    )
  ){
    return
  }

  ST.loading=true;
  ST.error="";

  if(
    location.hash.startsWith(
      "#/studio"
    )
  ){
    render(1)
  }

  try{
    const response=
      await nevaeh.execute({
        capability:
          "studio.pwa.bootstrap",

        payload:{}
      });

    ST.projects=
      response.result?.projects||
      response.projects||
      [];

    ST.objectTypes=
      response.result?.object_types||
      response.object_types||
      [];

    ST.loaded=true;
  }catch(error){
    ST.error=
      error.message||
      "Studio could not be loaded";

    ST.loaded=false;
  }finally{
    ST.loading=false;

    if(
      location.hash.startsWith(
        "#/studio"
      )
    ){
      render(1)
    }
  }
},

    document.querySelector(
      "#messages-detail"
    );

  if(!list||!detail) return;

      await nevaeh.execute({
        capability:"messages.list",
        payload:{}
      });

    MS.items=
      response.result?.conversations||
      response.conversations||
      [];

    if(
      MS.selected &&
      !MS.items.some(
        item=>
          Number(item.id)===
          Number(MS.selected)
      )
    ){
      MS.selected=null;
      MS.detail=null;

messageOpen:async id=>{
  const conversationId=
    Number(id);

  const detail=
    document.querySelector(
      "#messages-detail"
    );

  const list=
    document.querySelector(
      "#messages-list"
    );

  const shell=
    document.querySelector(
      "#messages-shell"
    );

  if(
    !conversationId||
    !detail
  ) return;

  MS.selected=
    conversationId;

  MS.detail=
    null;

  MS.groupManage=false;
  MS.groupManageAdd=false;
  MS.groupManageQuery="";
  MS.groupManagePeople=[];
  MS.groupManageSelected=
    new Set();

  const token=
    ++MS.openToken;

  shell?.classList.add(
    "has-open"
  );

  if(list){
    list.innerHTML=
      messageRows(MS.items);
  }

  detail.innerHTML=`
    <div class="msg-status">
      Loading conversation…
    </div>
  `;

  try{
    const response=
      await nevaeh.execute({
        capability:"messages.show",

        payload:{
          conversation_id:
            conversationId
        }
      });

    if(token!==MS.openToken){
      return;
    }

    const conversation=
      response.result?.conversation||
      response.conversation||
      null;

    if(!conversation){
      throw new Error(
        "Conversation response was empty"
      )
    }

    MS.detail=
      conversation;

    detail.innerHTML=
      messageConversationPanel(
        conversation
      );

    messageScrollBottom();

    if(
      Number(
        conversation.unread_count||
        0
      )>0
    ){
      try{
        await nevaeh.execute({
          capability:
            "messages.mark_read",

          payload:{
            conversation_id:
              conversationId
          }
        });

        const row=
          MS.items.find(
            item=>
              Number(item.id)===
              conversationId
          );

        if(row){
          row.unread_count=0;
        }

        conversation.unread_count=0;

        if(list){
          list.innerHTML=
            messageRows(
              MS.items
            );
        }
      }catch(error){
        console.warn(
          "[Lightek Messages] mark read failed",
          error
        );
      }
    }
  }catch(error){
    if(token!==MS.openToken){
      return;
    }

    detail.innerHTML=`
      <div class="msg-empty">
        <div>
          <span class="eb">Conversation unavailable</span>
          <h2>Couldn’t open this message.</h2>
          <p>${E(error.message||"Please try again.")}</p>
        </div>
      </div>
    `;
  }
},

messageGroupPeopleLoad:async()=>{
  const list=
    document.querySelector(
      "#message-group-manage-people"
    );

  if(
    !list||
    !MS.groupManage||
    !MS.groupManageAdd||
    MS.detail?.kind!=="group"
  ){
    return;
  }

  const token=
    ++MS.groupManageToken;

  list.innerHTML=`
    <div class="msg-status">
      Loading people…
    </div>
  `;

  try{
    const response=
      await nevaeh.execute({
        capability:
          "social.people.recommend",

        payload:{
          query:
            MS.groupManageQuery,

          limit:
            30
        }
      });

    if(
      token!==
      MS.groupManageToken
    ){
      return;
    }

    const activeIds=
      new Set(
        (MS.detail.participants||[])
          .map(entry=>
            Number(
              entry.profile?.id
            )
          )
          .filter(Boolean)
      );

    const myId=
      Number(
        meProfile()?.id
      );

    const recommendations=
      response.result?.recommendations||
      response.recommendations||
      [];

    MS.groupManagePeople=
      recommendations
        .map(record=>({
          ...(record?.profile||{}),

          relationship:
            record?.relationship||{},

          recommendation:
            record?.recommendation||{}
        }))
        .filter(profile=>{
          const profileId=
            Number(profile.id);

          return (
            profileId &&
            profileId!==myId &&
            !activeIds.has(
              profileId
            )
          )
        });

    list.innerHTML=
      messageGroupPeopleRows(
        MS.groupManagePeople
      );
  }catch(error){
    if(
      token!==
      MS.groupManageToken
    ){
      return;
    }

    list.innerHTML=`
      <div
        class="msg-empty"
        style="min-height:180px"
      >
        <div>
          <span class="eb">
            People unavailable
          </span>

          <h2>
            Couldn't load profiles.
          </h2>

          <p>
            ${E(error.message||"Please try again.")}
          </p>
        </div>
      </div>
    `;
  }
},

    return;
  }

  const sendButton=
    document.querySelector(
      '[data-a="messageSend"]'
    );

  MS.sending=true;

  if(sendButton){
    sendButton.disabled=true;
    sendButton.textContent=
      "Sending…";
  }

  try{
    const response=
      await nevaeh.execute({
        capability:"messages.send",

        payload:{
          conversation_id:
            conversationId,

          body:body
        }
      });

    const message=
      response.result?.message||
      response.message||
      null;

    const conversation=
      response.result?.conversation||
      response.conversation||
      null;

    input.value="";

    if(
      MS.detail &&
      Number(MS.detail.id)===
        conversationId &&
      message
    ){
      MS.detail.messages=
        [
          ...(MS.detail.messages||[]),
          message
        ];

      MS.detail.last_message=
        message;

      MS.detail.last_message_at=
        message.created_at;

      const detail=
        document.querySelector(
          "#messages-detail"
        );

      if(detail){
        detail.innerHTML=
          messageConversationPanel(
            MS.detail
          );
      }
    }

    const index=
      MS.items.findIndex(
        item=>
          Number(item.id)===
          conversationId
      );

    if(index>=0){
      const current=
        MS.items.splice(
          index,
          1
        )[0];

      Object.assign(
        current,
        conversation||{},
        {
          last_message:
            message||
            current.last_message,

          last_message_at:
            message?.created_at||
            conversation?.last_message_at||
            current.last_message_at,

          unread_count:
            0
        }
      );

      MS.items.unshift(
        current
      );
    }

    const list=
      document.querySelector(
        "#messages-list"
      );

    if(list){
      list.innerHTML=
        messageRows(
          MS.items
        );
    }

    messageScrollBottom();

    requestAnimationFrame(()=>{
      document
        .querySelector(
          "#message-compose"
        )
        ?.focus();
    });
  }catch(error){
    toast(
      error.message||
      "Message could not be sent"
    );
  }finally{
    MS.sending=false;

    const currentButton=
      document.querySelector(
        '[data-a="messageSend"]'
      );

    if(currentButton){
      currentButton.disabled=false;
      currentButton.textContent=
        "Send";
    }
  }
},

app.addEventListener('click',e=>{const s=e.target.closest('[data-sc]');if(s){e.preventDefault();document.getElementById(s.dataset.sc)?.scrollIntoView({behavior:'smooth'});return}const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b,e)});
app.addEventListener('input',e=>{
  const n=e.target.name;

  const studioCreateField=
    e.target.dataset?.studioCreateField;

  const studioLibrarySearch=
    e.target.dataset?.studioLibrarySearch;

  const studioTemplateSearch=
    e.target.dataset?.studioTemplateSearch;

  const studioTemplateMakerField=
    e.target.dataset?.studioTemplateMakerField;

  if(studioTemplateMakerField==="name"){
    ST.templateMakerName=
      e.target.value
  }

  if(studioTemplateMakerField==="purpose"){
    ST.templateMakerPurpose=
      e.target.value
  }

  if(studioTemplateSearch==="query"){
    ST.templateQuery=
      e.target.value;

    studioTemplateEnsureSelection();
    studioTemplateRefresh()
  }

  if(studioLibrarySearch==="query"){
    ST.libraryQuery=
      e.target.value;

    studioLibraryRefreshResults()
  }

  if(studioCreateField==="name"){
    ST.createName=
      e.target.value;
  }

  if(studioCreateField==="brief"){
    ST.createBrief=
      e.target.value;
  }

  if(
    n=='title'||
    n=='desc'
  ){
    CS[n]=e.target.value;
    const p=$('#pv');
    if(p)p.innerHTML=pv()
  }

  if(
    e.target.id==='message-group-title'
  ){
    MS.groupTitle=
      e.target.value;
  }

  if(
    e.target.id==='message-people-search'
  ){
    MS.query=
      e.target.value;

    clearTimeout(
      MS.searchTimer
    );

    MS.searchTimer=
      setTimeout(
        ()=>A.messagePeopleLoad(),
        220
      );
  }
  if(
    e.target.id==='message-group-manage-search'
  ){
    MS.groupManageQuery=
      e.target.value;

    clearTimeout(
      MS.groupManageSearchTimer
    );

    MS.groupManageSearchTimer=
      setTimeout(
        ()=>A.messageGroupPeopleLoad(),
        220
      );
  }
});

app.addEventListener('change',e=>{if(e.target.id=='fi'){CS.file=e.target.files[0]?.name||'';render(1)}});
app.addEventListener('keydown',e=>{
  const desktopKeyboard=
    window.matchMedia(
      '(hover: hover) and (pointer: fine)'
    ).matches;

  if(
    e.key==='Enter'&&
    e.target.id==='message-compose'&&
    !e.shiftKey&&
    !e.isComposing&&
    desktopKeyboard
  ){
    e.preventDefault();
    A.messageSend();
    return
  }

  if(
    e.key==='Enter'&&
    e.target.id==='ci'
  ){
    A.send()
  }
});

addEventListener('lightek.bootstrap.ready',event=>{
  window.LightekIdentity=event.detail?.identity||null;

  const p=meProfile();

  if(p){
    S.mode=
      p.profile_type==='creator'
        ?'creator'
        :p.profile_type==='organization'
          ?'org'
          :'person';
  }

  const route=
    location.hash
      .replace(/^#\//,'')
      .split('/')[0];

  if(
    route==='space'||
    route==='create'||
    route==='studio'||
    route==='messages'
  ){
    render();
  }
});
