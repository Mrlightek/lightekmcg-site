<style>
:root{--bg:#05060a;--panel:#0b0d14;--line:#1c2030;--ink:#e9edf5;--mut:#8b94a8;--cy:#00ffff;--mg:#ff00ff;--grad:linear-gradient(90deg,var(--cy),var(--mg));color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.6 'Space Mono',ui-monospace,monospace;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;margin:0;line-height:.95}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}.mk path{stroke:#fff;stroke-opacity:.28;stroke-width:.6;stroke-linejoin:round}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cy)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(5,6,10,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}.brand{display:flex;align-items:center;gap:12px;font:800 24px 'Barlow Condensed';letter-spacing:.06em}.brand svg{width:44px;height:34px}.brand span{font-weight:500;color:var(--mut)}
.hl{display:flex;gap:22px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}.hl a:hover{color:var(--cy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 20px;font:700 12px 'Space Mono';letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--cy);color:var(--cy);background:transparent;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:.2s}
.btn:hover,.btn.solid{background:var(--grad);color:#02030a;border-color:transparent}.btn.solid:hover{filter:brightness(1.15);box-shadow:0 0 36px #00ffff55}.btn.full{width:100%}.btn[disabled]{opacity:.5;pointer-events:none}
.cartbtn{position:relative}.cnt{background:var(--mg);color:#000;border-radius:9px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 5px}
.top{padding:70px 0 34px;position:relative;overflow:hidden}.top::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 85% 0,#00ffff1c,transparent 70%),radial-gradient(500px 300px at 100% 60%,#ff00ff17,transparent 70%)}
.top .wrap{position:relative}.top h1{font-size:clamp(48px,7vw,96px);font-weight:800;margin:12px 0}.top p{color:var(--mut);max-width:560px;margin:0}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:34px 0 26px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.chip{padding:9px 16px;border:1px solid var(--line);background:var(--panel);font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;color:var(--mut)}.chip.on,.chip:hover{border-color:var(--cy);color:var(--cy)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:90px}
.p{background:linear-gradient(160deg,#0f1220,var(--panel));border:1px solid var(--line);display:flex;flex-direction:column;transition:.25s;position:relative}.p:hover{border-color:#00ffff66;transform:translateY(-4px);box-shadow:0 22px 60px -24px #00ffff55}
.plate{height:210px;display:grid;place-items:center;background:radial-gradient(260px 160px at 50% 55%,#00ffff22,#ff00ff12 55%,transparent 75%);cursor:pointer;overflow:hidden}.plate img{max-width:86%;max-height:86%;transition:.4s}.p:hover .plate img{transform:scale(1.06)}.plate svg{width:120px;height:96px}
.pb{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}.tag{font-size:10px;letter-spacing:.2em;color:var(--mg);text-transform:uppercase}.p h3{font-size:30px;cursor:pointer}.p p{margin:0;color:var(--mut);font-size:12.5px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}.price{font:800 28px 'Barlow Condensed'}.price small{font:400 11px 'Space Mono';color:var(--mut)}
.badge{position:absolute;left:14px;top:14px;font-size:10px;letter-spacing:.14em;border:1px solid #00ffff55;color:var(--cy);padding:3px 8px;background:#05060acc;z-index:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s;z-index:60}.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--panel);border-left:1px solid #00ffff44;z-index:61;transform:translateX(105%);transition:.38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.dr.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.dh h3{font-size:30px}.x{background:none;border:1px solid var(--line);width:38px;height:38px;cursor:pointer;font-size:18px}.x:hover{border-color:var(--cy);color:var(--cy)}
.db{flex:1;overflow-y:auto;padding:22px}.df{padding:18px 22px;border-top:1px solid var(--line);display:grid;gap:12px}
.hero img{width:100%;max-height:260px;object-fit:contain;background:radial-gradient(300px 170px at 50% 55%,#00ffff22,transparent 75%);padding:10px}.hero{display:grid;place-items:center;min-height:200px;background:radial-gradient(300px 170px at 50% 55%,#00ffff1c,#ff00ff10 60%,transparent);margin-bottom:18px}.hero svg{width:150px;height:120px}
ul.sp{list-style:none;margin:16px 0;padding:0;border-top:1px solid var(--line)}ul.sp li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}ul.sp li::before{content:"▸";color:var(--cy)}
label{display:grid;gap:6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:12px;font:inherit;font-size:13px;border-radius:0;outline:0;width:100%}input:focus,select:focus,textarea:focus{border-color:var(--cy);box-shadow:0 0 0 3px #00ffff22}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .w{grid-column:1/-1}
.li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}.li .th{height:56px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}.li img{max-width:90%;max-height:90%}.li .th svg{width:34px;height:28px}
.qty{display:inline-flex;border:1px solid var(--line);margin-top:6px}.qty button{background:none;border:0;width:28px;height:28px;cursor:pointer}.qty button:hover{color:var(--cy)}.qty span{min-width:26px;text-align:center;line-height:28px}
.sum{display:flex;justify-content:space-between;font:800 26px 'Barlow Condensed';text-transform:uppercase}.note{font-size:11.5px;color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:60px 0}
.done{text-align:center;padding:40px 6px}.done b{display:block;font:800 52px 'Barlow Condensed';margin:12px 0}
.steps{display:flex;gap:6px;margin-bottom:18px}.steps i{flex:1;height:3px;background:var(--line)}.steps i.on{background:var(--grad)}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:12px}footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.hl a.m{display:none}}@media(max-width:600px){.grid{grid-template-columns:1fr}.fg{grid-template-columns:1fr}.top{padding-top:44px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

];
const $=s=>document.querySelector(s),money=n=>'$'+Math.round(n).toLocaleString('en-US');
let cart=[];try{cart=JSON.parse(localStorage.getItem('ltkcart')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('ltkcart',JSON.stringify(cart))}catch(e){}};
const P=id=>CAT.find(p=>p.id==id);const unit=l=>{const p=P(l.id);return p.tiers?Math.round(p.price*p.tiers[l.t||0][1]):p.price};
let filt='all';
function plate(p){return p.img?`<img src="${IMG[p.img]}" alt="${p.name}">`:MK}
function grid(){$('#grid').innerHTML=CAT.filter(p=>filt=='all'||p.cat==filt).map(p=>`<article class="p">${p.badge?`<span class="badge">${p.badge}</span>`:''}<div class="plate" onclick="openP('${p.id}')">${plate(p)}</div><div class="pb"><span class="tag">${p.tag}</span><h3 onclick="openP('${p.id}')">${p.name}</h3><p>${p.short}</p><div class="row"><div class="price">${p.tiers?'<small>from </small>':''}${money(p.price)}</div><button class="btn" onclick="openP('${p.id}')">Details</button></div></div></article>`).join('')}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;filt=b.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c==b));grid()};
function show(el){$('#ov').classList.add('on');el.classList.add('on')}
function closeAll(){document.querySelectorAll('.dr').forEach(d=>d.classList.remove('on'));$('#ov').classList.remove('on');if(location.hash)history.replaceState(null,'',location.pathname+location.search)}
$('#ov').onclick=closeAll;document.addEventListener('keydown',e=>{if(e.key=='Escape')closeAll()});
function openP(id){const p=P(id);location.hash=id;
$('#pd').innerHTML=`<div class="dh"><h3>${p.name}</h3><button class="x" onclick="closeAll()" aria-label="Close">✕</button></div><div class="db"><div class="hero">${p.img?`<img src="${IMG[p.img]}" alt="${p.name}">`:MK}</div><span class="tag">${p.tag}</span><p>${p.long}</p><ul class="sp">${p.specs.map(s=>`<li>${s}</li>`).join('')}</ul>
${p.tiers?`<label>Package<select id="tier" onchange="pp('${id}')">${p.tiers.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join('')}</select></label>`:`<label>Quantity<input id="q" type="number" min="1" max="20" value="1"></label>`}
<p class="note">${p.ship?'Pre-orders ship as units are built. You’ll get a payment link by email after we confirm availability.':'Scoped to your mission. We confirm the plan and send a payment link before work begins.'}</p></div>
<div class="df"><div class="sum"><span>Total</span><span id="pt">${money(p.price)}</span></div><button class="btn solid full" onclick="addTo('${id}')">Add to cart</button></div>`;show($('#pd'))}
function pp(id){const p=P(id),t=+$('#tier').value;$('#pt').textContent=money(p.price*p.tiers[t][1])}
function addTo(id){const p=P(id),t=p.tiers?+$('#tier').value:0,q=p.tiers?1:Math.max(1,+$('#q').value||1),ex=cart.find(l=>l.id==id&&l.t==t);ex?ex.q+=q:cart.push({id,t,q});save();openC()}
let step=0;
const count=()=>cart.reduce((a,l)=>a+l.q,0),total=()=>cart.reduce((a,l)=>a+unit(l)*l.q,0);
function openC(){step=0;drawC();closeP();show($('#cd'))}function closeP(){$('#pd').classList.remove('on')}
function drawC(){$('#cc').textContent=count();const el=$('#cd'),ship=cart.some(l=>P(l.id).ship);
const head=t=>`<div class="dh"><h3>${t}</h3><button class="x" onclick="closeAll()" aria-label="Close">✕</button></div>`,st=`<div class="steps"><i class="on"></i><i class="${step>0?'on':''}"></i><i class="${step>1?'on':''}"></i></div>`;
if(step==2){el.innerHTML=head('Order received')+`<div class="db"><div class="done">${MK.replace('class="mk"','class="mk" style="width:110px;height:88px"')}<b class="grad">${window.ref}</b><p>Brief locked in. We’ll confirm availability and scope, then send your payment link by email.</p><button class="btn full" onclick="closeAll()">Keep browsing</button></div></div>`;return}
if(!cart.length){el.innerHTML=head('Your cart')+`<div class="db"><div class="empty">Nothing deployed yet.<br><br><button class="btn" onclick="closeAll()">Browse the armory</button></div></div>`;return}
if(step==0){el.innerHTML=head('Your cart')+`<div class="db">${st}${cart.map((l,i)=>{const p=P(l.id);return `<div class="li"><div class="th">${p.img?`<img src="${IMG[p.img]}" alt="">`:MK}</div><div><b>${p.name}</b><div class="note">${p.tiers?p.tiers[l.t][0]:p.tag}</div><div class="qty"><button onclick="chg(${i},-1)">−</button><span>${l.q}</span><button onclick="chg(${i},1)">+</button></div></div><div class="price">${money(unit(l)*l.q)}</div></div>`}).join('')}</div><div class="df"><div class="sum"><span>Subtotal</span><span>${money(total())}</span></div><p class="note" style="margin:0">Shipping and tax confirmed with your payment link.</p><button class="btn solid full" onclick="step=1;drawC()">Checkout →</button></div>`;return}
el.innerHTML=head('Checkout')+`<form id="co" class="db" style="display:contents" onsubmit="place(event)"><div class="db">${st}<div class="fg"><label>Name<input name="name" required autocomplete="name"></label><label>Organization<input name="org" autocomplete="organization"></label><label class="w">Email<input type="email" name="email" required autocomplete="email"></label><label class="w">Phone<input name="phone" autocomplete="tel"></label>
${ship?`<label class="w">Shipping address<input name="addr" required autocomplete="street-address"></label><label>City<input name="city" required autocomplete="address-level2"></label><label>State / ZIP<input name="zip" required autocomplete="postal-code"></label>`:''}
<label class="w">Notes / mission brief<textarea name="notes" rows="4" placeholder="Deadlines, branding, anything we should know"></textarea></label></div></div>
<div class="df"><div class="sum"><span>Total</span><span>${money(total())}</span></div><button class="btn solid full" type="submit">Place order</button><button class="btn full" type="button" onclick="step=0;drawC()">← Back to cart</button></div></form>`}
function chg(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);save();drawC()}
function place(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),ref='LTK-'+Date.now().toString(36).toUpperCase(),body={ref,customer:d,items:cart.map(l=>({id:l.id,name:P(l.id).name,option:P(l.id).tiers?P(l.id).tiers[l.t][0]:null,qty:l.q,unit:unit(l)})),total:total()},ep=document.body.dataset.endpoint;
const fin=()=>{window.ref=ref;cart=[];save();step=2;drawC()};if(ep){fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(fin).catch(fin)}else fin()}
$('#cb').onclick=openC;
function route(){const id=location.hash.slice(1);if(id&&P(id))openP(id)}addEventListener('hashchange',route);
grid();$('#cc').textContent=count();route();
</script></body></html>
